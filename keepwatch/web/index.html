<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepwatch</title>
  <meta name="description" content="See what your rivals keep running, kill and launch, and turn their winners into your ads.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8553D'/%3E%3Cpath d='M9 16a7 7 0 0 1 14 0' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='18' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Main">
      <div class="rail-logo" title="Keepwatch"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 16a7 7 0 0 1 14 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="16" cy="18" r="3" fill="#fff"/></svg></div>
      <button class="rail-btn" data-view="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button>
      <button class="rail-btn" data-view="search" title="Search ads" aria-label="Search ads"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="rail-btn" data-view="alerts" title="This week" aria-label="This week"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot" id="alert-dot" hidden></span></button>
      <button class="rail-btn" data-view="library" title="Your ads" aria-label="Your ads"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
      <button class="rail-btn" data-view="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-avatar" data-view="settings" id="brand-avatar" title="Your brand" aria-label="Your brand">?</button>
    </nav>

    <aside class="sidebar" aria-label="Rivals">
      <button class="side-head" id="side-category"><span><small>Category</small><strong id="category-name">Your category</strong></span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="side-label">Rivals <span id="rival-count"></span></div>
      <ul class="rival-list" id="rival-list"></ul>
      <button class="side-add" data-view="settings">+ Track a rival</button>
    </aside>

    <main class="main">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="overview">Overview</button>
        <button role="tab" data-tab="playbook">Playbook</button>
        <button role="tab" data-tab="hooks">Hooks &amp; angles</button>
        <button role="tab" data-tab="rebuild">Rebuild</button>
        <button role="tab" data-tab="test">Ad test</button>
      </div>
      <div class="content" id="content" tabindex="-1"></div>
    </main>

    <aside class="rightbar" id="rightbar" aria-label="This week"></aside>

    <footer class="bottombar">
      <span id="foot-left">Loading…</span>
      <span id="foot-right"></span>
    </footer>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
