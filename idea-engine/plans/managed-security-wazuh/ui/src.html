  if (t.closest('[data-share-link]')) { P().sharedLink = true; renderRight(); UI.toast('Read-only auditor link copied (expires Dec 11, 2026)'); return; }
  const es = t.closest('[data-escalate]'); if (es) { const p = P(); p.escalated = p.escalated || {}; p.escalated[es.dataset.escalate] = NOW.time; p.disableReq[es.dataset.escalate] = true; renderAll(); UI.toast('Escalated to Dr. Alan Kim (owner) with the overdue removal'); return; }
  const cr = t.closest('[data-confirm-removal]'); if (cr) { const l = P().leavers.find(x => x.acct === cr.dataset.confirmRemoval); if (l) { l.removed = 'Nov 11, 2026 ' + NOW.time; l.by = 'Marco Diaz (IT)'; } renderAll(); UI.toast('Access removal confirmed and logged for compliance'); return; }
  if (t.closest('[data-open-side]')) { UI.openDrawer('side'); return; }
  const dis = t.closest('[data-disable]'); if (dis) { P().disableReq[dis.dataset.disable] = true; renderAll(); UI.toast('Disable request sent to IT (due tomorrow)'); return; }
  if (t.closest('[data-add-leaver]')) { const p = P(); if (!p.leavers.some(l => l.acct === 'c-moore')) { p.leavers.unshift({ name: 'Chris Moore', role: 'Front desk', last: NOW.iso, acct: 'c-moore', auto: true }); } renderAll(); UI.toast('Leaver added: disable request sent to IT for today'); return; }
  if (t.closest('[data-remind]')) { P().remind = true; rerender('people'); UI.toast('Training reminder sent'); return; }
  const nud = t.closest('[data-nudge]'); if (nud) { P().mfaNudged[nud.dataset.nudge] = true; rerender('accounts'); UI.toast('MFA setup reminder sent'); return; }
  const af = t.closest('[data-af]'); if (af) { P().acctFilter = af.dataset.af; rerender('accounts'); $(`[data-af="${P().acctFilter}"]`).focus(); return; }
  const cf = t.closest('[data-cf]'); if (cf) { S.clientFilter = cf.dataset.cf; renderSide(); $(`[data-cf="${S.clientFilter}"]`).focus(); return; }
  const sf = t.closest('[data-safe]'); if (sf) { S.clientSafe = sf.dataset.safe === '1'; renderAll(); $(`[data-safe="${sf.dataset.safe}"]`).focus(); return; }
  const qb = t.closest('[data-qbr]'); if (qb) { S.qbrOrg = qb.dataset.qbr; setOrg(S.qbrOrg); renderAll(); const p = $('[data-testid="qbr-preview"]'); p && p.scrollIntoView({ block: 'nearest' }); return; }
  if (t.closest('[data-wlprev]')) { S.wlPreview = !S.wlPreview; rerender('partner'); $('[data-wlprev]').focus(); return; }
  const so = t.closest('[data-select-org]'); if (so) { setOrg(so.dataset.selectOrg); renderAll(); UI.selectTab('overview'); return; }
  if (t.closest('[data-sample]')) { S.report.from = 'billing-dept@paypa1-secure.com'; S.report.subj = 'Your invoice is overdue'; S.report.did = $('#rep-did').value; rerender('report'); return; }
  if (t.closest('[data-report]')) { const f = S.report; f.from = $('#rep-from').value.trim(); f.subj = $('#rep-subj').value.trim(); f.did = $('#rep-did').value; const paste = $('#rep-paste').value.trim();
    if (!paste && (!f.from || !f.subj)) { f.err = 'Add the sender and subject, or paste the whole email.'; rerender('report'); return; }
    f.err = ''; f.state = 'sent'; S.reports.unshift(['Today', f.subj || 'Pasted email', 'checking']); rerender('report'); renderSide(); say('Sent. An analyst is checking.'); return; }
  if (t.closest('[data-mock-reply]')) { S.report.state = 'verdict'; S.reports[0][2] = 'phish'; rerender('report'); renderSide(); say('Analyst verdict: phishing'); return; }
  if (t.closest('[data-report-new]')) { S.report = { from: '', subj: '', did: 'none', state: 'form', err: '' }; rerender('report'); return; }
  const oi = t.closest('[data-open-inc]'); if (oi) { const [org, id] = oi.dataset.openInc.split(':'); setOrg(org); P(org).incOpen = id; closePop(); renderAll(); UI.selectTab('incidents'); return; }
  const mi = t.closest('[data-mine]'); if (mi) { S.notifMine = mi.dataset.mine === '1'; renderPop(); return; }
  const q = t.closest('[data-q]'); if (q) { S.searchQ = q.dataset.q; renderPop(); return; }
  const sc = t.closest('[data-scope]'); if (sc) { S.searchScope = sc.dataset.scope; renderPop(); return; }
  if (t.closest('[data-open-settings]')) { openPop('settings'); return; }
  if (t.closest('#pop-close') || t.closest('[data-close-pop]')) { closePop(); return; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fw') { P().fw = e.target.value; renderAll(); $('#fw').focus(); say(`Showing ${FW[e.target.value].name} controls`); }
  if (id === 'dev-site') { P().devSite = e.target.value; renderAll(); $('#dev-site').focus(); }
  if (id === 'dev-status') { P().devStatus = e.target.value; rerender('devices'); $('#dev-status').focus(); }
  if (id === 'resale-rate') { S.resaleRate = +e.target.value; renderAll(); $('#resale-rate').focus(); }
  if (e.target.dataset.price) { const o = e.target.dataset.price; P(o).price = e.target.value ? +e.target.value : null; renderAll(); $('#price-' + o).focus(); }
  if (id === 'wl-color') { S.wlColor = e.target.value; renderAll(); $('#wl-color').focus(); }
  if (id === 'rep-did') S.report.did = e.target.value;
});
document.addEventListener('input', e => {
  if (e.target.id === 'client-q') { S.clientQ = e.target.value; const pos = e.target.selectionStart; renderSide(); const i = $('#client-q'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === 'search-q') { S.searchQ = e.target.value; $('#search-results').innerHTML = searchResults(); }
  if (e.target.id === 'rep-from') S.report.from = e.target.value;
  if (e.target.id === 'rep-subj') S.report.subj = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pop) { closePop(); const b = $('.rail button[data-view="search"]'); b && b.focus(); }
  if (e.key === 'Tab' && document.body.classList.contains('drawer-open')) {
    const d = $('.side.open, .right.open'); if (!d) return; const f = [...d.querySelectorAll('button,select,input,a[href]')].filter(x => x.offsetParent);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
})();
</script>
