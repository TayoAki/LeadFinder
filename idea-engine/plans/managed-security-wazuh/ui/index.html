:root[data-theme="dark"]{

*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg)}

.app{display:grid;height:100vh;grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--right);grid-template-rows:minmax(0,1fr) var(--bar);
  grid-template-areas:"rail side main right" "bar bar bar bar"}

.content{flex:1;overflow:auto;padding:20px 22px}
.panel[hidden]{display:none}
h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:12px} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between} .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}

.bar-track{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden} .bar-fill{height:100%;background:var(--accent);border-radius:4px}

.toggle-side,.toggle-right{display:none;flex:none}
.drawer-close{display:none;margin-left:auto}

/* Tablet: right bar becomes a drawer */
@media (max-width:1180px){ .app{grid-template-columns:var(--rail) var(--side) minmax(0,1fr);grid-template-areas:"rail side main" "bar bar bar"}

  table{font-size:13px} .hide-sm{display:none} }

<body>
<div class="app">
  <nav class="rail" aria-label="Main" id="rail"></nav>

  <aside class="side" aria-label="Sidebar" id="side">
    <div class="side-head"><button class="drawer-close btn" aria-label="Close">✕</button></div>
    <label class="viewas">Mockup only · View as
      <select id="role" class="role-switch" aria-label="View as (mockup role)">
        <optgroup label="Business (one company)">
          <option value="owner">Business owner (BrightSmile)</option>
          <option value="office">Office manager (BrightSmile)</option>
          <option value="it">IT manager (BrightSmile)</option>
          <option value="staff">Employee (BrightSmile)</option>
        </optgroup>
        <optgroup label="MSP partner console (Northwind IT)">
          <option value="msp_tech">MSP technician</option>
          <option value="msp_am">MSP account manager</option>
          <option value="msp_owner">MSP owner</option>
        </optgroup>
        <optgroup label="Shared read-only links">
          <option value="auditor">Auditor (read-only, Ridgeline)</option>
          <option value="broker">Insurance broker (BrightSmile pack)</option>
          <option value="counsel">Privacy counsel (BrightSmile)</option>
        </optgroup>
      </select>
    </label>
    <div id="side-body"></div>
  </aside>

  <main class="main">
    <div class="tabbar">
      <button class="toggle-side btn" aria-label="Open sidebar">☰</button>
      <div class="tabs" role="tablist" aria-label="Workspace" id="tabs"></div>
      <button class="toggle-right btn" aria-label="Open context panel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
    </div>
    <div class="content" id="content">
      <div class="ctx" id="ctx" data-testid="ctx"></div>
      <section class="panel" id="panel-queue" role="tabpanel" aria-labelledby="tab-queue" hidden></section>
      <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" hidden></section>
      <section class="panel" id="panel-incidents" role="tabpanel" aria-labelledby="tab-incidents" hidden></section>
      <section class="panel" id="panel-devices" role="tabpanel" aria-labelledby="tab-devices" hidden></section>

<script>// Shared behaviour for the three mockups. No backend.
// Hooks an app can define: window.onTab(id), window.onSelect(id), window.onRail(view), window.onRole(role), window.onReady().
(function(){
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
  window.UI = { $, $$ };
  let lastFocus = null;
  function selectTab(id){
    const panel = $('#panel-' + id); if (!panel) return;
    $$('.tabs [role="tab"]').forEach(t => { const on = t.dataset.tab === id; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
    $$('.panel').forEach(p => p.hidden = p !== panel);
    // keep the rail in sync: highlight the rail button that targets this tab, if any
    const railBtn = $$('.rail button[data-tab-target]').find(b => b.dataset.tabTarget.split(' ').includes(id));
    $$('.rail button[data-view]').forEach(x => x.removeAttribute('aria-current'));
    if (railBtn) railBtn.setAttribute('aria-current', 'page');
    document.body.dataset.tab = id;
    if (window.onTab) window.onTab(id);
    try { localStorage.setItem(document.title + ':tab', id); } catch(e) {}
  }
  function openDrawer(which){
    const el = $(which === 'side' ? '.side' : '.right'); if (!el) return;
    lastFocus = document.activeElement; el.classList.add('open'); document.body.classList.add('drawer-open');
    const close = el.querySelector('.drawer-close') || el.querySelector('button,select,a,[tabindex]'); close && close.focus();
  }
  function closeDrawers(){
    $$('.side.open,.right.open').forEach(e => e.classList.remove('open')); document.body.classList.remove('drawer-open');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); lastFocus = null;
  }
  window.UI.selectTab = selectTab; window.UI.closeDrawers = closeDrawers; window.UI.openDrawer = openDrawer;
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t && t !== document.body && t !== document.documentElement) selectTab(t.dataset.tab);
    const goto = e.target.closest('[data-goto]'); if (goto) selectTab(goto.dataset.goto);
    const it = e.target.closest('.side .item[data-select]');
    if (it) { $$('.side .item[data-select]').forEach(x => x.removeAttribute('aria-current')); it.setAttribute('aria-current', 'true');
      if (window.onSelect) window.onSelect(it.dataset.select); if (window.matchMedia('(max-width:760px)').matches) closeDrawers(); }
    const r = e.target.closest('.rail button[data-view]');
    if (r) { if (r.dataset.tabTarget) selectTab(r.dataset.tabTarget.split(' ')[0]);
      $$('.rail button[data-view]').forEach(x => x.removeAttribute('aria-current')); r.setAttribute('aria-current', 'page');
      if (window.onRail) window.onRail(r.dataset.view); }
    if (e.target.closest('.toggle-side')) { $('.side').classList.contains('open') ? closeDrawers() : openDrawer('side'); }
    if (e.target.closest('.toggle-right')) { $('.right').classList.contains('open') ? closeDrawers() : openDrawer('right'); }
    if (e.target.closest('.drawer-close') || e.target.closest('.backdrop')) closeDrawers();
    const a = e.target.closest('[data-toast]'); if (a) toast(a.dataset.toast);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawers(); return; }
    const tab = e.target.closest && e.target.closest('.tabs [role="tab"]'); if (!tab) return;
    const tabs = $$('.tabs [role="tab"]').filter(t => !t.hidden), i = tabs.indexOf(tab);
    let n = null;
    if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
    if (e.key === 'ArrowLeft') n = tabs[(i + tabs.length - 1) % tabs.length];
    if (e.key === 'Home') n = tabs[0]; if (e.key === 'End') n = tabs[tabs.length - 1];
    if (n) { e.preventDefault(); n.focus(); selectTab(n.dataset.tab); }
  });
  document.addEventListener('change', e => { if (e.target.id === 'role' && window.onRole) { document.body.dataset.role = e.target.value; window.onRole(e.target.value); } });
  function toast(msg){ let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
  window.UI.toast = toast;
  window.addEventListener('DOMContentLoaded', () => {
    if (!$('.backdrop')) { const b = document.createElement('div'); b.className = 'backdrop'; b.setAttribute('aria-hidden', 'true'); document.body.appendChild(b); }
    const role = $('#role'); if (role) document.body.dataset.role = role.value;
    if (window.onReady) window.onReady();
    let start = $('.tabs [role="tab"]:not([hidden])')?.dataset.tab;
    const h = location.hash.replace('#', ''); if (h && $('#panel-' + h)) start = h;
    if (start) selectTab(start);
  });
})();
</script>

function D(id){
  const o = ORGS[id];
  const total = o.sites.reduce((a, s) => a + s.ep, 0);
  const offline = o.devices.filter(d => d.offline).sort((a, b) => b.impact - a.impact);
  const reporting = total - offline.length;
  const threats = o.incidents.filter(i => i.threat);
  const open = o.incidents.filter(i => i.status === 'action');
  const vulnHosts = o.vulns.reduce((a, v) => a + v.hosts.length, 0);
  const mfaGap = o.accounts.filter(a => a.mfa === false);
  const dormant = o.accounts.filter(a => a.last >= 30 && !a.service);
  const dormantOpen = dormant.filter(a => !S.disableReq[id + ':' + a.id]);
  const avgContain = threats.length ? Math.round(threats.reduce((a, i) => a + i.containMin, 0) / threats.length) : null;
  const hipaa = o.frameworks.includes('hipaa');
  const urgent = [], todo = [];
  open.forEach(i => urgent.push({ text: i.do[0], short: i.short || 'finish an incident task', tab: 'incidents', inc: i.id }));
  o.vulns.forEach(v => urgent.push({ text: `Have IT install 1 critical update on ${v.hosts.length} ${v.hosts.length > 1 ? 'machines' : 'machine'} (${v.hosts.join(', ')})`, short: `install 1 critical update on ${v.hosts.length} ${v.hosts.length > 1 ? 'machines' : 'machine'}`, tab: 'devices' }));
  if (offline.length) urgent.push({ text: `Reconnect ${offline.length} ${offline.length > 1 ? 'devices' : 'device'} that stopped reporting (${offline[0].n} first)`, short: `reconnect ${offline.length} silent ${offline.length > 1 ? 'devices' : 'device'}`, tab: 'devices' });
  if (mfaGap.length) todo.push({ text: `Turn on MFA for ${mfaGap.length} ${mfaGap.length > 1 ? 'accounts' : 'account'} (${mfaGap.map(a => a.n).join(', ')})`, tab: 'accounts' });
  if (dormantOpen.length) todo.push({ text: `Disable ${dormantOpen.length} ${dormantOpen.length > 1 ? 'accounts' : 'account'} unused for 30+ days`, tab: 'accounts' });
  if (!o.trainingUploaded) todo.push({ text: 'Upload security-training certificates (counts for compliance and insurance)', tab: 'compliance' });
  if (hipaa && !o.archive6y) todo.push({ text: 'Turn on the 6-year log archive for HIPAA documentation', tab: 'compliance' });
  if (o.baa && o.baa.status !== 'signed') todo.push({ text: 'Sign the business associate agreement (BAA)', tab: 'compliance' });
  const plan = directPlan(total);
  const r = resale(total, S.resaleRate);
  const wholesale = total * WHOLESALE_PER_DEVICE;
  return { o, total, offline, reporting, threats, open, vulnHosts, mfaGap, dormant, dormantOpen, avgContain, urgent, todo, attention: urgent.length > 0, plan, resale: r, wholesale,
    escalated: o.incidents.length, usersMfa: o.users - mfaGap.length };
}

function check(o, d, key, fwId){

   case 'logs': return { s: 'met', note: 'Windows, Microsoft 365 and firewall logs collected; last event 12 s ago', src: 'Wazuh log collection', owner: 'Watchpost SOC', when: today };
   case 'login': return { s: 'met', note: `Failed and unusual sign-ins reviewed 24/7 (${o.alertsReviewed.toLocaleString()} alerts in 30 days)`, src: 'Wazuh + M365 sign-in logs', owner: 'Watchpost SOC', when: today };
   case 'sigs': return { s: 'met', note: 'Detection rules and malware signatures updated daily', src: 'Wazuh ruleset', owner: 'Watchpost SOC', when: today };
   case 'fim': return { s: 'met', note: 'File integrity monitoring on servers holding card data', src: 'Wazuh FIM', owner: 'Watchpost SOC', when: today };
   case 'sca': return d.vulnHosts ? { s: 'partial', note: `${d.vulnHosts} machine(s) fail the benchmark because of missing updates`, src: 'Wazuh configuration assessment', owner: 'Your IT', when: today } : { s: 'met', note: 'All servers pass the CIS benchmark baseline', src: 'Wazuh configuration assessment', owner: 'Your IT', when: today };
   case 'edr': return d.offline.length ? { s: 'partial', note: `${d.reporting} of ${d.total} devices reporting; ${d.offline.length} not reporting`, src: 'Wazuh agent inventory', owner: 'Your IT', when: today } : { s: 'met', note: `All ${d.total} devices reporting`, src: 'Wazuh agent inventory', owner: 'Watchpost SOC', when: today };
   case 'inventory': return d.offline.length ? { s: 'partial', note: `${d.offline.length} devices silent`, src: 'Wazuh agent inventory', owner: 'Your IT', when: today } : { s: 'met', note: `${d.total} devices identified and reporting`, src: 'Wazuh agent inventory', owner: 'Watchpost SOC', when: today };

   case 'mfa': return d.mfaGap.length ? { s: 'partial', note: `${d.mfaGap.length} of ${o.users} users without MFA (${d.mfaGap.map(a => a.n).join(', ')})`, src: 'Microsoft 365 / Entra ID', owner: 'Your IT', when: today } : { s: 'met', note: `MFA on for all ${o.users} users`, src: 'Microsoft 365 / Entra ID', owner: 'Your IT', when: today };

   case 'ir': return { s: 'met', note: `Watchpost 24/7 response + your written plan (updated ${fmtDate(o.irPlan)})`, src: 'Incident log + uploaded plan', owner: 'Watchpost SOC + you', when: today };
   case 'backup': return { s: 'met', note: `Backups restore-tested ${fmtDate(o.backupTested)}`, src: 'Backup report (customer)', owner: 'Your IT', when: fmtDate(o.backupTested) };
   case 'risk': return { s: 'met', note: `Risk assessment done ${fmtDate(o.riskAssessed)}`, src: 'Uploaded assessment', owner: 'Your team', when: fmtDate(o.riskAssessed) };

    $('#pop-body').innerHTML = `<label class="field">Host, user, IP or text<input type="search" id="search-q" value="${esc(S.searchQ)}" placeholder="e.g. FRONTDESK-02 or 102.89"></label>
     ${r.kind === 'msp' ? `<div class="seg" role="group" aria-label="Search scope" style="margin-top:8px"><button data-scope="org" aria-pressed="${S.searchScope === 'org'}">${esc(o.short)}</button><button data-scope="all" aria-pressed="${S.searchScope === 'all'}">All clients</button></div>` : ''}
     <div class="row" style="margin:8px 0">${[...new Set(chips)].map(c => `<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>
     <div id="search-results" data-testid="search-results" aria-live="polite">${searchResults()}</div>`;
  } else if (S.pop === 'alerts') {
    $('#pop-title').textContent = 'Notifications';
    const items = r.kind === 'msp' ? mspOpen().map(({ id, i }) => ({ t: `${ORGS[id].short}: ${i.title}`, s: i.when, go: `${id}:${i.id}` })) : [...d.urgent.map(u => ({ t: u.text, s: 'Needs action', tab: u.tab, inc: u.inc })), ...o.incidents.filter(i => i.status !== 'action').map(i => ({ t: i.title, s: `${incStatusText(i)} · ${i.when}`, tab: 'incidents' }))];
    $('#pop-body').innerHTML = `<p class="small muted" style="margin:0 0 6px" data-testid="notif-count">${r.kind === 'msp' ? mspOpen().length : d.urgent.length} need action</p><div data-testid="notifications">${items.map(x => `<div class="res"><div>${esc(x.t)}</div><div class="row between"><span class="small muted">${esc(x.s)}</span>${x.go ? `<button class="btn sm" data-open-inc="${x.go}">Open</button>` : hasTab(x.tab) ? `<button class="btn sm" data-goto="${x.tab}" data-close-pop>Open</button>` : ''}</div></div>`).join('') || '<p class="small muted">No notifications.</p>'}</div>
     <h3 style="font-size:13px;margin:14px 0 6px">How you get alerts</h3><div data-testid="escalation-mini">${o.contacts.map((c, n) => `<div class="small">${n + 1}. ${esc(c.who)}: ${esc(c.how)}</div>`).join('')}</div>`;
  } else if (S.pop === 'settings') {
    $('#pop-title').textContent = 'Settings';
    $('#pop-body').innerHTML = `<h3 style="font-size:13px;margin:0 0 6px">Alert contacts and escalation order${r.kind === 'msp' ? ' · ' + esc(o.short) : ''}</h3>
     <div data-testid="escalation">${o.contacts.map((c, n) => `<div class="res"><strong>${n + 1}. ${esc(c.who)}</strong><div class="small muted">${esc(c.how)}</div></div>`).join('')}</div>
     <h3 style="font-size:13px;margin:14px 0 6px">My notification channels</h3>
     <label class="row small"><input type="checkbox" checked> SMS for high-severity incidents</label><label class="row small"><input type="checkbox" checked> Email for every incident</label><label class="row small"><input type="checkbox"> Phone call after hours if no reply in 15 min</label>
     ${r.kind === 'msp' ? `<h3 style="font-size:13px;margin:14px 0 6px">Integrations</h3><div class="small">${MSP.psa}: ✓ connected · ${MSP.rmm}: ✓ connected</div>` : ''}
     <div class="row" style="margin-top:12px"><button class="btn primary sm" data-toast="Settings saved" data-close-pop>Save</button></div>`;
  }
}
const incStatusText = i => ({ action: 'Action needed', contained: 'Contained', done: 'Done', benign: 'Confirmed OK' }[i.status]);

/* ---------------- Render all ---------------- */
const PANELS = { queue: pQueue, overview: pOverview, incidents: pIncidents, devices: pDevices, accounts: pAccounts, compliance: pCompliance, insurance: pInsurance, billing: pBilling, partner: pPartner, report: pReport };
function renderPanels(){ for (const [k, f] of Object.entries(PANELS)) { const el = $('#panel-' + k); el.innerHTML = hasTab(k) ? f() : ''; } }
function renderAll(){
  const fid = document.activeElement && (document.activeElement.id || document.activeElement.dataset.testid);
  renderRail(); renderSide(); renderCtx(); renderPanels(); renderRight(); renderBottom(); if (S.pop) renderPop();
  if (fid) { const el = document.getElementById(fid) || $(`[data-testid="${fid}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
const say = m => { $('#live').textContent = ''; setTimeout(() => $('#live').textContent = m, 30); };

/* ---------------- Hooks ---------------- */
// Note: the kit's click handler matches body[data-tab] on every click and re-selects the current tab,
// so only re-render when the tab really changes, and defer rail/sidebar so the kit's later branches still see the clicked element.
let lastTab = null;
window.onTab = id => { if (id === lastTab) return; lastTab = id; renderRight(); renderCtx(); const tb = document.getElementById('tab-' + id); if (tb) { const box = tb.parentElement; box.scrollLeft = Math.max(0, tb.offsetLeft - box.offsetLeft - (box.clientWidth - tb.offsetWidth) / 2); } queueMicrotask(() => { renderSide(); renderRail(); }); };
window.onSelect = id => {
  if (id === 'all') { UI.selectTab('queue'); return; }
  if (id.startsWith('site:')) { S.devSite = id.slice(5); renderAll(); if (hasTab('devices')) UI.selectTab('devices'); return; }
  if (id.startsWith('fw:')) { S.fw[S.org] = id.slice(3); renderAll(); UI.selectTab('compliance'); return; }
  S.org = id; S.mspOrg = id; S.devSite = 'all'; S.devStatus = 'all'; S.qbr = false; S.wlPreview = false; S.exportOpen = false;
  renderAll(); if (curTab() === 'queue') UI.selectTab('overview'); else UI.selectTab(curTab());
  say(`Now showing ${ORGS[id].name}`);
};
window.onRail = v => { if (['search', 'alerts', 'settings'].includes(v)) openPop(v); else closePop(); };
window.onRole = role => {
  S.role = role; const r = R(); S.org = r.org || S.mspOrg; S.devSite = 'all'; S.devStatus = 'all'; S.acctFilter = 'all'; S.qbr = false; S.wlPreview = false; S.exportOpen = false; S.verdict = null;
  closePop(); renderTabs(); renderAll(); UI.selectTab(r.tabs[0]);
  if (window.matchMedia('(max-width:760px)').matches) UI.closeDrawers();
  say(`Viewing as ${$('#role').selectedOptions[0].textContent}`);
};
window.onReady = () => { renderTabs(); renderAll(); };

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (S.pop && t.isConnected && !t.closest('#pop') && !t.closest('.rail button[data-view="search"],.rail button[data-view="alerts"],.rail button[data-view="settings"]')) closePop();
  const inc = t.closest('[data-inc]'); if (inc) { const id = inc.dataset.inc; S.incOpen[S.org] = S.incOpen[S.org] === id ? null : id; $('#panel-incidents').innerHTML = pIncidents(); renderRight(); const b = $('#inc-btn-' + id); b && b.focus({ preventScroll: true }); b && b.scrollIntoView({ block: 'start', behavior: 'instant' }); say(S.incOpen[S.org] ? 'Details shown' : 'Details hidden'); return; }
  const done = t.closest('[data-done]'); if (done) { const i = O().incidents.find(x => x.id === done.dataset.done); i.status = 'done'; renderAll(); UI.toast('Marked done. Thanks, the analyst has been told.'); return; }
  const ctrl = t.closest('[data-ctrl]'); if (ctrl) { S.ctrlOpen[ctrl.dataset.ctrl] = !S.ctrlOpen[ctrl.dataset.ctrl]; $('#panel-compliance').innerHTML = pCompliance(); const b = $(`[data-ctrl="${CSS.escape(ctrl.dataset.ctrl)}"]`); b && b.focus({ preventScroll: true }); return; }
  if (t.closest('[data-upload-training]')) { O().trainingUploaded = true; renderAll(); UI.toast('Training certificates uploaded: counts for compliance and insurance'); return; }
  if (t.closest('[data-archive]')) { O().archive6y = true; renderAll(); UI.toast('6-year log archive turned on (included in your plan)'); return; }
  if (t.closest('[data-export-open]')) { S.exportOpen = !S.exportOpen; $('#panel-compliance').innerHTML = pCompliance(); $('[data-export-open]').focus(); return; }
  if (t.closest('[data-export-go]')) { const what = `${FW[fwOf()].short} · ${$('#exp-period').value} · ${$('#exp-format').value}`; S.exports.unshift({ when: 'Nov 11, 2026', what }); $('#panel-compliance').innerHTML = pCompliance(); UI.toast(`Evidence pack exported: ${what}`); return; }
  if (t.closest('[data-share-link]')) { S.sharedLink = true; renderRight(); UI.toast('Read-only auditor link copied (expires Dec 11, 2026)'); return; }
  const dis = t.closest('[data-disable]'); if (dis) { S.disableReq[S.org + ':' + dis.dataset.disable] = true; renderAll(); UI.toast('Disable request sent to IT'); return; }
  const nud = t.closest('[data-nudge]'); if (nud) { S.mfaNudged[S.org + ':' + nud.dataset.nudge] = true; $('#panel-accounts').innerHTML = pAccounts(); UI.toast('MFA setup reminder sent'); return; }
  const af = t.closest('[data-af]'); if (af) { S.acctFilter = af.dataset.af; $('#panel-accounts').innerHTML = pAccounts(); $(`[data-af="${S.acctFilter}"]`).focus(); return; }
  const cf = t.closest('[data-cf]'); if (cf) { S.clientFilter = cf.dataset.cf; renderSide(); $(`[data-cf="${S.clientFilter}"]`).focus(); return; }
  const qb = t.closest('[data-qbr]'); if (qb) { S.qbr = qb.dataset.qbr; if (S.qbr !== S.org) { S.org = S.qbr; S.mspOrg = S.qbr; } renderAll(); const p = $('[data-testid="qbr-preview"]'); p && p.scrollIntoView({ block: 'nearest' }); return; }
  if (t.closest('[data-wlprev]')) { S.wlPreview = !S.wlPreview; $('#panel-partner').innerHTML = pPartner(); $('[data-wlprev]').focus(); return; }
  if (t.closest('[data-report]')) { S.verdict = $('#rep-did').value; $('#panel-report').innerHTML = pReport(); say('Analyst verdict: phishing'); return; }
  const oi = t.closest('[data-open-inc]'); if (oi) { const [org, id] = oi.dataset.openInc.split(':'); S.org = org; S.mspOrg = org; S.incOpen[org] = id; closePop(); renderAll(); UI.selectTab('incidents'); return; }
  const q = t.closest('[data-q]'); if (q) { S.searchQ = q.dataset.q; renderPop(); return; }
  const sc = t.closest('[data-scope]'); if (sc) { S.searchScope = sc.dataset.scope; renderPop(); return; }
  if (t.closest('[data-open-settings]')) { openPop('settings'); return; }
  if (t.closest('#pop-close') || t.closest('[data-close-pop]')) { closePop(); return; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fw') { S.fw[S.org] = e.target.value; renderAll(); $('#fw').focus(); say(`Showing ${FW[e.target.value].name} controls`); }
  if (id === 'dev-site') { S.devSite = e.target.value; renderAll(); $('#dev-site').focus(); }
  if (id === 'dev-status') { S.devStatus = e.target.value; $('#panel-devices').innerHTML = pDevices(); $('#dev-status').focus(); }
  if (id === 'resale-rate') { S.resaleRate = +e.target.value; renderAll(); $('#resale-rate').focus(); }
  if (id === 'wl-color') { S.wlColor = e.target.value; renderAll(); $('#wl-color').focus(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'client-q') { S.clientQ = e.target.value; const pos = e.target.selectionStart; renderSide(); const i = $('#client-q'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === 'search-q') { S.searchQ = e.target.value; $('#search-results').innerHTML = searchResults(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pop) { closePop(); const b = $('.rail button[data-view="search"]'); b && b.focus(); }
  if (e.key === 'Tab' && document.body.classList.contains('drawer-open')) { // keep focus inside the open drawer
    const d = $('.side.open, .right.open'); if (!d) return; const f = [...d.querySelectorAll('button,select,input,a[href]')].filter(x => x.offsetParent);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
})();
</script>
</body>
</html>
