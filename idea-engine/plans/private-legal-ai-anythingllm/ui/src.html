<style>/*SHELL_CSS*/
:root{--accent:#5534d6;--accent-weak:#eeeaff;--focus:#5534d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#b3a2ff;--accent-weak:#262046;--focus:#b3a2ff;--faint:#a7afbb}}
:root[data-theme="dark"]{--accent:#b3a2ff;--accent-weak:#262046;--focus:#b3a2ff;--faint:#a7afbb}

:root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .rail .badge,:root[data-theme="dark"] .badge-inline{color:var(--on-accent)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.cite{display:inline-grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--accent-weak);color:var(--accent);margin:0 2px 0 3px;vertical-align:baseline;border:1px solid transparent;line-height:1}
.cite:hover,.cite[aria-pressed="true"]{border-color:var(--accent)}
.q{font-weight:600;margin-bottom:6px}
.turn{display:flex;flex-direction:column;gap:6px}
.input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-width:0}
select.input{padding:6px 8px}
label.lbl{font-size:12px;color:var(--muted);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .ev{position:relative;padding:6px 8px 10px;border-radius:8px;cursor:pointer}
.tl .ev::before{content:'';position:absolute;left:-23px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .ev.sel{background:var(--accent-weak)} .tl .ev:hover{background:var(--panel-2)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;font-family:Georgia,"Times New Roman",serif;line-height:1.6;min-width:0}
.doc p{margin:0 0 10px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.privacy{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-size:13px}
.privacy svg{flex:none;color:var(--good)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--warn-weak);border-color:transparent} .banner.good{background:var(--good-weak);border-color:transparent} .banner.info{background:var(--accent-weak);border-color:transparent} .banner.bad{background:var(--bad-weak);border-color:transparent}
.banner svg{flex:none;margin-top:2px}
.banner strong{color:var(--text)} .banner .tag{font-weight:700}
.banner.warn .tag{color:var(--warn)} .banner.good .tag{color:var(--good)} .banner.info .tag{color:var(--accent)} .banner.bad .tag{color:var(--bad)}
.tablewrap{overflow-x:auto;max-width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0}
.page{background:#fff;color:#222;border:1px solid #cfd4dc;border-radius:6px;padding:10px 12px;font:11px/1.5 Georgia,serif;margin-top:8px}
.page .ln{height:6px;background:#e3e6eb;border-radius:3px;margin:5px 0} .page .ln.s{width:70%}
.page mark{background:#ffe58a;color:#222;padding:1px 2px;display:block;border-left:3px solid #c08a00}
.page .ph{display:flex;justify-content:space-between;color:#555;font-size:10px;font-family:ui-sans-serif,system-ui,sans-serif}
mark.term{background:var(--accent-weak);color:var(--text);padding:0 2px;border-radius:3px}
.sel-row{background:var(--accent-weak)}
tr.clickable{cursor:pointer} tr.clickable:hover{background:var(--panel-2)}
.state{font-size:12px;font-weight:600}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-size:12px;font-weight:600;min-height:28px}
.chipbtn[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.linkbtn{color:var(--accent);text-decoration:underline;font-weight:600;padding:0;min-height:24px}
.drawer-head{display:flex}
.denied{max-width:620px} .denied h1{margin-bottom:8px}
.rail button .lock{position:absolute;bottom:3px;right:3px;width:12px;height:12px;color:var(--muted)}
.rail button[hidden]{display:none} .rail .badge[hidden]{display:none}
.rail .rl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crumb{display:none;flex:1;min-width:0;font-weight:600;padding:12px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.nonmatter .tabs{display:none} body.nonmatter .crumb{display:block}
.toggle-side .tm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.checklist label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.checklist input{width:18px;height:18px;margin-top:1px}
.tree{font-size:12px;line-height:1.7;margin:6px 0 0;padding-left:16px}
.peek{display:none}
@media (max-width:1180px){.peek{display:block}}
.section{margin-top:16px} .section > h2{font-size:15px;margin:0 0 8px}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.icon-ok,.icon-warn,.icon-bad{font-weight:700}
.vlabel{font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.side .top{flex-direction:column;align-items:flex-start;gap:2px}
.side .top small{font-weight:400;color:var(--muted);font-size:12px}
.item .tagline{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.mini{font-size:12px}
.right .card + .card{margin-top:8px}
.badge-inline{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:0 6px}

  .tabs button{padding:12px 8px;font-size:13px}

  .toggle-side,.toggle-right{padding:6px 8px}
  .rail .badge{top:2px;right:calc(50% - 20px)}
  .tabs button{padding:12px 10px}
  .vlabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.cards-sm thead{display:none}
  table.cards-sm,table.cards-sm tbody,table.cards-sm tr,table.cards-sm td{display:block;width:100%}
  table.cards-sm tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px;background:var(--panel)}

function batesCheck(m) {

  return issues.length ? banner('warn', 'Bates check:', issues.join('; ')) : banner('good', 'Bates check:', `no gaps or overlaps across ${vols.map(v => v.id).join(', ')}.`);
}

  $('#avatar').textContent = P[ME()].n.split(' ').map(x => x[0]).join('');
  $('#avatar').title = 'Signed in as ' + P[ME()].n + ' (' + R().label + ')';
}
function renderBars() {
  const area = TAB_AREA(S.tab), inMatter = area === 'matter' && allowed('matter');
  document.body.classList.toggle('nonmatter', !inMatter);
  const m = M[S.matter];
  $('#crumb').textContent = inMatter ? '' : AREA_NAME[area] + (allowed(area) ? '' : ' (not available)');
  $('#tm').textContent = allowed('matter') && m ? ' ' + m.short : S.tab === 'intake' && allowed('intake') ? ' Queue' : ' Menu';
  $('.toggle-side').setAttribute('aria-label', allowed('matter') ? `Show matters list (current: ${m ? m.name : 'none'})` : 'Show side panel');
  let n = 0; if (S.tab === 'ask' && m && !aiBlocked(m) && m.threads[0]) n = new Set(m.threads[S.thread[S.matter] || 0].turns.flatMap(t => turnOrder(m, t))).size;
  const lab = S.tab === 'ask' && n ? `Sources ${n}` : 'Details';
  $('.toggle-right').textContent = lab; $('.toggle-right').setAttribute('aria-label', `Show context panel: ${lab}`);
}
function render() {
  const ae = document.activeElement, keep = ae && ae !== document.body && (ae.id ? '#' + ae.id : ae.dataset && ae.dataset.act ? `[data-act="${ae.dataset.act}"]${ae.dataset.id ? `[data-id="${ae.dataset.id}"]` : ''}${ae.dataset.src ? `[data-src="${ae.dataset.src}"]` : ''}` : null);
  renderRail(); renderSide(); renderBars();
  Object.entries(PANELS).forEach(([id, fn]) => { const el = $('#panel-' + id); if (!el) return; if (el.hidden) { el.innerHTML = ''; return; } el.innerHTML = allowed(TAB_AREA(id)) ? fn() : denied(id); });
  $('#right').innerHTML = rightFor(S.tab);
  const u = P[ME()];
  $('#bb-flow').innerHTML = `Documents stay in your instance; excerpts to ${MODEL.name} via Bedrock, zero retention <button class="linkbtn" data-goto="admin" style="font-size:12px">details</button>`;
  $('#bb-saved').textContent = u.ext ? WS[ws()].name : `You: ≈${h1(u.saved / 30 * 7)} h saved per week (30-day avg)`;
  if (keep) { try { const el = $(keep); if (el && !el.disabled && el.offsetParent) el.focus({ preventScroll: true }); } catch (e) {} }
}

/* ============ Actions ============ */
const goTab = id => { if (id === S.tab) render(); else UI.selectTab(id); };
const audit = (mid, act, text) => AUDIT.unshift([TODAY, NOW_T, ME(), mid, act, text]);
function indexVolume(f) {
  f.st = 'indexing'; f.done = 0; render();
  const tick = () => { f.done = Math.min(f.docs, f.done + Math.ceil(f.docs / 4)); if (f.done >= f.docs) { f.st = 'indexed'; f.inc = 1; f.ocr = 41; UI.toast(`${f.id} indexed: ${num(f.docs - (f.exc || 0))} documents, ${f.exc || 0} exceptions`); render(); } else { render(); setTimeout(tick, 120); } };
  setTimeout(tick, 120);
}
const ACT = {
  cite: a => { S.src[a.dataset.m] = a.dataset.src; render(); },
  openright: () => UI.openDrawer('right'),
  scope: () => { S.scopeOpen = !S.scopeOpen; render(); },
  loadvol: a => indexVolume(M[S.matter].folders.find(x => x.id === a.dataset.id)),
  togglepriv: () => { const f = M[S.matter].folders.find(x => x.priv); f.inc = f.inc ? 0 : 1; audit(S.matter, 'policy', (f.inc ? 'Included' : 'Excluded') + ' privileged folder in Ask scope'); render(); },
  rerun: a => { const m = M[S.matter], t = m.threads[S.thread[S.matter] || 0].turns[+a.dataset.i]; t.scope = scopeDocs(m); t.at = `Re-run ${fmtD(TODAY)} ${NOW_T}`; render(); },
  thread: a => { S.thread[S.matter] = +a.dataset.i; render(); },
  send: () => askSend(),
  copy: a => { const sel = $('#copyas-' + a.dataset.i); UI.toast({ plain: 'Copied as plain text', bates: 'Copied with Bates cites (e.g. COASTAL_000412)', bluebook: 'Copied with record cites (e.g. Marsh Dep. 47:3–9)' }[sel ? sel.value : 'plain']); },
  todraft: a => { S.carry[S.matter] = +a.dataset.i; const d = ds(S.matter); d.tpl = 't4'; goTab('draft'); },
  approve: () => { const d = ds(S.matter); d.st = 'approved'; d.by = ME(); d.self = !!R().self; audit(S.matter, 'draft', (d.self ? 'Self-reviewed and approved ' : 'Approved ') + TPL[d.tpl].n); render(); },
  sendreview: () => { const d = ds(S.matter); d.st = 'sent'; UI.toast('Sent to ' + P[d.reviewer].n + ' for review'); render(); },
  translate: () => { const d = ds(S.matter); d.tr = !d.tr; render(); },
  trreview: () => { const d = ds(S.matter); d.trSt = 'reviewed'; d.trBy = ME(); render(); },
  export: () => { const m = M[S.matter], d = ds(S.matter); d.exp = `${m.short}_${TPL[d.tpl].n.split(':')[0].toLowerCase().replace(/\s+/g, '-')}_${TODAY}.docx`; d.expApproved = d.st === 'approved'; audit(S.matter, 'export', 'Exported ' + d.exp + (d.expApproved ? '' : ' (unapproved, watermarked DRAFT)')); render(); },
  sendclient: () => { const d = ds(S.matter); d.sent = { email: 'email', portal: 'client portal', whatsapp: 'WhatsApp', print: 'print and mail' }[d.channel]; audit(S.matter, 'export', 'Sent approved letter to client via ' + d.sent); render(); },
  batch: () => { const d = ds(S.matter); d.batch = IMM_PENDING.filter(n => !(n === 'Herrera' && d.sent)).length; render(); },
  selfnoop: () => {},
  accept: a => { rv(S.matter)[a.dataset.id] = 'accepted'; S.clause[S.matter] = a.dataset.id; render(); },
  ignore: a => { rv(S.matter)[a.dataset.id] = 'ignored'; S.clause[S.matter] = a.dataset.id; render(); },
  clauseundo: a => { delete rv(S.matter)[a.dataset.id]; render(); },
  redline: () => { const r = rv(S.matter); r.redline = M[S.matter].clauses.filter(c => r[c[0]] === 'accepted').length; render(); },
  pbedit: a => { S.pbEdit = a.dataset.id; S.clause[S.matter] = a.dataset.id; render(); },
  pbcancel: () => { S.pbEdit = null; render(); },
  pbsave: () => { const id = S.matter, c = M[id].clauses.find(x => x[0] === S.pbEdit); (S.pb[id] ||= {})[c[0]] = { pref: $('#pb-pref').value, fb: $('#pb-fb').value, by: ME() }; (S.pbSaved ||= {})[id] = `${c[2]} (${c[1]}) updated`; S.pbEdit = null; render(); },
  gomatter: a => { S.matter = a.dataset.id; goTab(a.dataset.to || 'ask'); },
  tlf: a => { S.tlf = a.dataset.f; render(); },
  addev: () => { S.addEv = !S.addEv; render(); },
  saveev: () => { const d = $('#ev-date').value, t = $('#ev-text').value.trim(); if (d && t) (S.extraEv[S.matter] ||= []).push({ d, t, k: 'document', s: null }); S.addEv = false; render(); },
  exportchron: a => { S.chron[S.matter] = a.dataset.f; render(); },
  verify: a => { S.dl[a.dataset.id] = { ...(S.dl[a.dataset.id] || {}), st: 'verified', by: ME(), on: TODAY }; S.dlSel = a.dataset.id; render(); },
  post: a => { S.dl[a.dataset.id] = { ...dlState(DL.find(d => d.id === a.dataset.id)), ...(S.dl[a.dataset.id] || {}), st: 'posted' }; S.dlSel = a.dataset.id; UI.toast('Posted to firm calendar with reminders'); render(); },
  dledit: a => { S.dlEdit = a.dataset.id; S.dlSel = a.dataset.id; render(); },
  dlsave: a => { const id = a.dataset.id; S.dl[id] = { ...(S.dl[id] || { st: 'new' }), date: $('#dl-date').value, rule: DL.find(d => d.id === id).rule + ' · corrected by ' + short(ME()) + ': ' + $('#dl-why').value }; S.dlEdit = null; render(); },
  dlreject: a => { S.dl[a.dataset.id] = { st: 'rejected', by: ME(), on: TODAY, why: 'Not a deadline (recorded reason)' }; render(); },
  dl: a => { S.dlSel = a.dataset.id; render(); },
  solok: () => { S.ist[S.intake].solOk = ME(); render(); },
  clear: () => { if (!nearDecided(S.intake)) return; S.ist[S.intake].cleared = ME(); audit(null, 'intake', 'Cleared conflict for ' + INTAKE[S.intake].n); render(); },
  waiver: () => { S.ist[S.intake].waiver = 1; render(); },
  reqclear: () => { S.ist[S.intake].requested = 1; render(); },
  book: a => { S.ist[S.intake].booked = SLOTS[S.intake].find(x => x.id === a.dataset.id); render(); },
  decline: () => { S.ist[S.intake].declined = 1; render(); },
  clio: () => { S.ist[S.intake].clio = 1; render(); },
  tapprove: a => { S.time[a.dataset.id] = { ...tst(a.dataset.id), st: 'approved', by: ME(), at: NOW_T }; render(); },
  treject: a => { S.time[a.dataset.id] = { ...tst(a.dataset.id), st: 'rejected', by: ME() }; render(); },
  treq: a => { S.time[a.dataset.id] = { ...tst(a.dataset.id), st: 'requested' }; render(); },
  reqall: () => { visibleTime().forEach(t => { if (tst(t.id).st === 'suggested') S.time[t.id] = { ...tst(t.id), st: 'requested' }; }); render(); },
  tpost: a => { S.time[a.dataset.id] = { ...tst(a.dataset.id), st: 'posted', at: NOW_T }; render(); },
  tundo: a => { S.time[a.dataset.id] = { ...tst(a.dataset.id), st: 'suggested' }; render(); },
  tedit: a => { S.editing = a.dataset.id; render(); },
  tsave: a => { const id = a.dataset.id; S.time[id] = { ...tst(id), narr: $('#narr-' + id).value, hours: Math.max(0, parseFloat($('#hrs-' + id).value) || 0) }; S.editing = null; render(); },
  approveall: () => { visibleTime().forEach(t => { if (['suggested', 'requested'].includes(tst(t.id).st) && canApproveT(t)) S.time[t.id] = { ...tst(t.id), st: 'approved', by: ME(), at: NOW_T }; }); render(); },
  retire: a => { S.tplSt[a.dataset.id] = { st: 'Retired', by: ME(), on: TODAY }; S.tplSel = a.dataset.id; render(); },
  unretire: a => { delete S.tplSt[a.dataset.id]; render(); },
  assign: a => { S.assigned[a.dataset.id] = 1; render(); },
  exporttraining: () => { S.done.training = 1; render(); },
  invite: a => { S.invites[a.dataset.id] = 1; render(); },
  sv: a => { S.sv[a.dataset.id] = ME(); render(); },
  exportreg: () => { S.done.reg = 1; UI.toast('AI-use register exported (CSV)'); render(); },
  carrier: () => { S.done.carrier = 1; UI.toast('Carrier questionnaire answers exported (12 common malpractice-insurer AI questions)'); render(); },
  exportinv: () => { S.done['inv-' + S.matter] = 1; render(); },
  invoice: a => { S.done['inv' + a.dataset.id] = 1; render(); },
  secpack: () => { S.done.secpack = 1; render(); },
  imconnect: () => { S.im = 'flow'; render(); },
  imcancel: () => { S.im = 'off'; render(); },
  imstart: () => { S.im = 'connecting'; render(); setTimeout(() => { S.im = 'done'; render(); }, 600); },
  connectclio: () => { S.clio = true; render(); },
  closem: a => { S.retention[a.dataset.id] = { closed: TODAY }; audit(a.dataset.id, 'admin', 'Closed matter; retention applied to documents, index and threads'); render(); },
  hold: a => { S.hold[a.dataset.id] = { by: ME(), on: TODAY }; render(); },
  release: a => { delete S.hold[a.dataset.id]; render(); }
};
const ROW = {
  clause: id => { S.clause[S.matter] = id; render(); },
  ev: n => { const e = eventsOf(S.matter)[n - 1]; S.ev[S.matter] = +n; if (e && e.s) S.src[S.matter] = e.s; render(); },
  dl: id => { S.dlSel = id; render(); },
  tpl: id => { S.tplSel = id; render(); }
};
const CHG = {
  tpl: v => { const d = ds(S.matter); if (tplStatus(v) !== 'Authoritative') return; d.tpl = v; d.st = 'needs'; d.exp = null; d.tr = false; render(); },
  channel: v => { ds(S.matter).channel = v; render(); },
  reviewer: v => { ds(S.matter).reviewer = v; render(); },
  copyas: () => {},
  selfcheck: (v, el) => { S.check[S.matter + el.dataset.i] = el.checked; render(); },
  nearDec: (v, el) => { const st = S.ist[S.intake]; (st.dec ||= {})[el.dataset.id] = v; render(); },
  reg: v => { S.reg = v; render(); },
  audit: v => { S.audit = v; render(); },
  jur: v => { S.jur = v; render(); },
  qscope: v => { S.qscope = v; $('#search-results').innerHTML = renderSearchResults(); },
  period: v => { S.period = v; render(); }
};
function askSend() {
  const inp = $('#ask-input'); const q = inp && inp.value.trim(); if (!q) { inp && inp.focus(); return; }
  const m = M[S.matter], words = q.toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const hits = Object.keys(m.src).filter(s => words.some(w => (m.src[s].t + ' ' + m.src[s].q).toLowerCase().includes(w))).slice(0, 2);
  const th = m.threads[S.thread[S.matter] || 0] || (m.threads[0] = { t: 'New thread', turns: [] });
  const base = { q, scope: scopeDocs(m), at: `${fmtD(TODAY)} ${NOW_T}` };
  th.turns.push(hits.length ? { ...base, a: 'Relevant passages: ' + hits.map(s => `"${m.src[s].q}"{${s}}`).join(' ') } : { ...base, kind: 'notfound', a: 'No passage in this matter mentions that. Try other words or widen the scope.' });
  render();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { if (a.disabled) return; const fn = ACT[a.dataset.act]; if (fn) fn(a, e); return; }
  const r = e.target.closest('[data-row]'); if (r && ROW[r.dataset.row]) ROW[r.dataset.row](r.dataset.id);
});
document.addEventListener('change', e => { const a = e.target.closest('[data-change]'); if (a && CHG[a.dataset.change]) CHG[a.dataset.change](a.value, a); });
document.addEventListener('input', e => { if (e.target.id === 'search-q') { S.q = e.target.value; $('#search-results').innerHTML = renderSearchResults(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ask-input') { e.preventDefault(); askSend(); } });

/* ============ Shell hooks ============ */
window.onTab = id => { S.tab = id; render(); };
window.onSelect = id => {
  if (INTAKE[id]) { S.intake = id; render(); return; }
  if (S.matter !== id) { S.tlf = 'all'; S.scopeOpen = false; S.addEv = false; S.pbEdit = null; }
  S.matter = id;
  if (TAB_AREA(S.tab) !== 'matter') goTab('ask'); else render();
};
window.onRail = () => {};
window.onRole = role => {
  S.role = role; S.editing = null; S.pbEdit = null;
  if (!canSee(S.matter)) S.matter = myMatters()[0];
  goTab(homeTab());   // a role switch is a new sign-in: land on that role's home page
};
window.onReady = () => {
  const groups = {}; Object.entries(ROLES).forEach(([k, r]) => { (groups[r.group || 'Hartwell & Vega LLP'] ||= []).push(`<option value="${k}" ${k === S.role ? 'selected' : ''}>${r.label}</option>`); });
  $('#role').innerHTML = Object.entries(groups).map(([g, o]) => `<optgroup label="${g}">${o.join('')}</optgroup>`).join('');
  document.body.dataset.role = S.role;
};

</script>
