<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briefcase mockup</title>
<style>/*SHELL_CSS*/
:root{--accent:#5534d6;--accent-weak:#eeeaff;--focus:#5534d6;--faint:#5d6470}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#b3a2ff;--accent-weak:#262046;--focus:#b3a2ff;--faint:#a7afbb}}
:root[data-theme="dark"]{--accent:#b3a2ff;--accent-weak:#262046;--focus:#b3a2ff;--faint:#a7afbb}
.cite{display:inline-grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--accent-weak);color:var(--accent);margin:0 2px 0 3px;vertical-align:baseline;border:1px solid transparent;line-height:1}
.cite:hover,.cite[aria-pressed="true"]{border-color:var(--accent)}
.q{font-weight:600;margin-bottom:6px}
.turn{display:flex;flex-direction:column;gap:6px}
.input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-width:0}
select.input{padding:6px 8px}
label.lbl{font-size:12px;color:var(--muted);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .ev{position:relative;padding:6px 8px 10px;border-radius:8px;cursor:pointer}
.tl .ev::before{content:'';position:absolute;left:-23px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .ev.sel{background:var(--accent-weak)} .tl .ev:hover{background:var(--panel-2)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;font-family:Georgia,"Times New Roman",serif;line-height:1.6;min-width:0}
.doc p{margin:0 0 10px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.privacy{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-size:13px}
.privacy svg{flex:none;color:var(--good)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--warn-weak);border-color:transparent} .banner.good{background:var(--good-weak);border-color:transparent} .banner.info{background:var(--accent-weak);border-color:transparent} .banner.bad{background:var(--bad-weak);border-color:transparent}
.banner strong{color:var(--text)} .banner .tag{font-weight:700}
.banner.warn .tag{color:var(--warn)} .banner.good .tag{color:var(--good)} .banner.info .tag{color:var(--accent)} .banner.bad .tag{color:var(--bad)}
.tablewrap{overflow-x:auto;max-width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0}
.page{background:#fff;color:#222;border:1px solid #cfd4dc;border-radius:6px;padding:10px 12px;font:11px/1.5 Georgia,serif;margin-top:8px}
.page .ln{height:6px;background:#e3e6eb;border-radius:3px;margin:5px 0} .page .ln.s{width:70%}
.page mark{background:#ffe58a;color:#222;padding:1px 2px;display:block;border-left:3px solid #c08a00}
.page .ph{display:flex;justify-content:space-between;color:#555;font-size:10px;font-family:ui-sans-serif,system-ui,sans-serif}
mark.term{background:var(--accent-weak);color:var(--text);padding:0 2px;border-radius:3px}
.sel-row{background:var(--accent-weak)}
tr.clickable{cursor:pointer} tr.clickable:hover{background:var(--panel-2)}
.state{font-size:12px;font-weight:600}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-size:12px;font-weight:600;min-height:28px}
.chipbtn[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.linkbtn{color:var(--accent);text-decoration:underline;font-weight:600;padding:0;min-height:24px}
.drawer-head{display:flex}
.denied{max-width:620px} .denied h1{margin-bottom:8px}
.rail button .lock{position:absolute;bottom:3px;right:3px;width:12px;height:12px;color:var(--muted)}
.rail button[hidden]{display:none}
.peek{display:none}
@media (max-width:1180px){.peek{display:block}}
.section{margin-top:16px} .section > h2{font-size:15px;margin:0 0 8px}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.icon-ok,.icon-warn,.icon-bad{font-weight:700}
.vlabel{font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.side .top{flex-direction:column;align-items:flex-start;gap:2px}
.side .top small{font-weight:400;color:var(--muted);font-size:12px}
.item .tagline{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.mini{font-size:12px}
.right .card + .card{margin-top:8px}
.badge-inline{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:0 6px}
@media (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .rail{gap:0;padding:4px 2px} .rail button{width:38px;height:44px} .rail .avatar{display:none}
  .rail .badge{top:2px;right:0}
  .tabs button{padding:12px 10px}
  .vlabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.cards-sm thead{display:none}
  table.cards-sm,table.cards-sm tbody,table.cards-sm tr,table.cards-sm td{display:block;width:100%}
  table.cards-sm tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px;background:var(--panel)}
  table.cards-sm td{border:0;padding:3px 0;display:flex;gap:10px;text-align:left}
  table.cards-sm td.num{text-align:left}
  table.cards-sm td::before{content:attr(data-label);flex:none;width:92px;font-size:12px;font-weight:600;color:var(--muted)}
  table.cards-sm td[data-label=""]::before{display:none}
  .content h1{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true">B</div>
    <button data-view="home" data-tab-target="ask draft review timeline" aria-current="page" aria-label="Matters" title="Matters"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button data-view="search" data-tab-target="search" aria-label="Search all documents you can access" title="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button data-view="docket" data-tab-target="docket" aria-label="Deadlines" title="Deadlines and docket"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></svg><span class="badge" aria-hidden="true"></span></button>
    <button data-view="intake" data-tab-target="intake" aria-label="Intake" title="Intake and conflicts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>
    <button data-view="time" data-tab-target="time" aria-label="Time entries" title="Time"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button data-view="knowledge" data-tab-target="knowledge" aria-label="Firm knowledge" title="Templates, precedents and playbooks"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5"/></svg></button>
    <button data-view="firm" data-tab-target="firm" aria-label="Firm insights" title="Firm insights"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button data-view="admin" data-tab-target="admin" aria-label="Admin and settings" title="Admin and settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
    <div class="spacer"></div><div class="avatar" id="avatar" aria-hidden="true">AC</div>
  </nav>

  <aside class="side" aria-label="Matters and queues">
    <div class="drawer-head"><button class="drawer-close btn" aria-label="Close">✕</button></div>
    <div id="side"></div>
  </aside>

  <main class="main">
    <div class="tabbar">
      <button class="toggle-side btn" aria-label="Show matters list">☰</button>
      <div class="tabs" role="tablist" aria-label="Matter tools">
        <button role="tab" id="tab-ask" data-tab="ask" aria-controls="panel-ask" aria-selected="true">Ask</button>
        <button role="tab" id="tab-draft" data-tab="draft" aria-controls="panel-draft">Draft</button>
        <button role="tab" id="tab-review" data-tab="review" aria-controls="panel-review">Review</button>
        <button role="tab" id="tab-timeline" data-tab="timeline" aria-controls="panel-timeline">Timeline</button>
      </div>
      <button class="toggle-right btn" aria-label="Show context panel">Details</button>
    </div>
    <div class="content">
      <section class="panel" id="panel-ask" role="tabpanel" aria-labelledby="tab-ask"></section>
      <section class="panel" id="panel-draft" role="tabpanel" aria-labelledby="tab-draft" hidden></section>
      <section class="panel" id="panel-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
      <section class="panel" id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden></section>
      <section class="panel" id="panel-search" aria-label="Search" hidden></section>
      <section class="panel" id="panel-docket" aria-label="Deadlines and docket" hidden></section>
      <section class="panel" id="panel-intake" aria-label="Intake" hidden></section>
      <section class="panel" id="panel-time" aria-label="Time entries" hidden></section>
      <section class="panel" id="panel-knowledge" aria-label="Firm knowledge" hidden></section>
      <section class="panel" id="panel-firm" aria-label="Firm insights" hidden></section>
      <section class="panel" id="panel-admin" aria-label="Admin and settings" hidden></section>
    </div>
  </main>

  <aside class="right" aria-label="Context for this screen">
    <div class="drawer-head"><button class="drawer-close btn" aria-label="Close">✕</button></div>
    <div id="right"></div>
  </aside>

  <footer class="bottombar">
    <span class="hstack"><label for="role" class="vlabel">View as</label><select id="role" class="role-switch"></select></span>
    <span><span class="status-dot" aria-hidden="true"></span>Private instance · healthy</span>
    <span class="hide-sm" id="bb-flow"></span>
    <span class="hide-sm">Audit log on</span>
    <span class="sep"></span>
    <span class="hide-sm" id="bb-saved"></span>
  </footer>
</div>
<script>/*SHELL_JS*/</script>
<script src="app.js"></script>
</body>
</html>
