<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlatDesk mockup</title>
<style>/* Shared app shell: left rail | sidebar | (tabs + main) | right sidebar, bottom bar across. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --line:#e3e6eb; --text:#16181d; --muted:#5d6470; --faint:#6b7280;
  --accent:#2f5bea; --accent-weak:#e8eefe; --good:#13795b; --good-weak:#e3f5ee; --warn:#a15c00; --warn-weak:#fff3df;
  --bad:#c0282d; --bad-weak:#fde8e8; --focus:#2f5bea; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:10px; --rail:64px; --side:264px; --right:312px; --bar:36px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:14px; line-height:1.45; color:var(--text);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#161a20; --panel-2:#1c2129; --line:#2a313b; --text:#e8eaee; --muted:#a7afbb; --faint:#9aa3ae;
  --accent:#7c9bff; --accent-weak:#1d2742; --good:#4cc38a; --good-weak:#13291f; --warn:#f0b357; --warn-weak:#2e2412;
  --bad:#ff7a7f; --bad-weak:#341a1b; --shadow:none; } }
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#161a20; --panel-2:#1c2129; --line:#2a313b; --text:#e8eaee; --muted:#a7afbb; --faint:#9aa3ae;
  --accent:#7c9bff; --accent-weak:#1d2742; --good:#4cc38a; --good-weak:#13291f; --warn:#f0b357; --warn-weak:#2e2412;
  --bad:#ff7a7f; --bad-weak:#341a1b; --shadow:none; }
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;height:100vh;grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--right);grid-template-rows:minmax(0,1fr) var(--bar);
  grid-template-areas:"rail side main right" "bar bar bar bar"}
.rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative}
.rail button:hover{background:var(--panel-2);color:var(--text)} .rail button[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}
.rail .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.rail .spacer{flex:1} .avatar{width:34px;height:34px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-weight:600;color:var(--muted);border:1px solid var(--line)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:16px 8px 6px;font-weight:600}
.side .top{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:8px;color:var(--text)}
.item:hover{background:var(--panel-2)} .item[aria-current="true"]{background:var(--accent-weak);color:var(--accent)}
.item .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel-2);color:var(--muted)}
.item .meta{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.item small{display:block;color:var(--faint);font-size:12px}
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tabbar{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--panel);padding:0 8px;gap:6px;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
@media (min-width:1181px){.tabs{-webkit-mask-image:none;mask-image:none}}
.tabs button{padding:12px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.content{flex:1;overflow:auto;padding:20px 22px}
.panel[hidden]{display:none}
h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:12px} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:14px} .kpi{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-label{color:var(--muted);font-size:12px} .delta{font-size:12px;font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-weak);color:var(--good)} .pill.bad{background:var(--bad-weak);color:var(--bad)} .pill.warn{background:var(--warn-weak);color:var(--warn)} .pill.info{background:var(--accent-weak);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn:hover{background:var(--panel-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.05)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between} .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar-track{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden} .bar-fill{height:100%;background:var(--accent);border-radius:4px}
.right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 14px}
.right h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:18px 0 8px;font-weight:600}
.right h2:first-child{margin-top:0}
.bottombar{grid-area:bar;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.bottombar .sep{flex:1} .status-dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.list{display:flex;flex-direction:column;gap:6px}
.msg{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)} .msg.me{background:var(--accent-weak);border-color:transparent}
.msg.ai{border-style:dashed;border-color:var(--accent)}
.toggle-side,.toggle-right{display:none;flex:none}
.drawer-close{display:none;margin-left:auto}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}
body.drawer-open .backdrop{opacity:1;pointer-events:auto}
.role-switch{font:inherit;font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.cite{min-width:24px;min-height:24px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;margin:2px 4px 2px 0}
.empty-note{color:var(--faint);font-size:12px}
.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* Tablet: right bar becomes a drawer */
@media (max-width:1180px){ .app{grid-template-columns:var(--rail) var(--side) minmax(0,1fr);grid-template-areas:"rail side main" "bar bar bar"}
  .right{position:fixed;right:0;top:0;bottom:var(--bar);width:min(340px,92vw);transform:translateX(100%);transition:transform .2s;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
  .right.open{transform:none} .toggle-right{display:inline-flex} .right .drawer-close{display:inline-flex} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Phone: sidebar becomes a drawer, rail moves to the bottom */
@media (max-width:760px){ :root{--bar:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto 56px;grid-template-areas:"main" "bar" "rail";height:100dvh}
  .rail{flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 8px}
  .rail .logo,.rail .spacer{display:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,88vw);transform:translateX(-105%);transition:transform .2s;z-index:21;box-shadow:8px 0 24px rgba(0,0,0,.12)}
  .side.open{transform:none} .right{bottom:0} .side .drawer-close{display:inline-flex}
  .toggle-side{display:inline-flex}
  .content{padding:14px 16px} .g3,.g2,.g4{grid-template-columns:minmax(0,1fr)}
  .bottombar{padding:6px 16px;gap:12px;overflow-x:auto} .bottombar .sep,.bottombar .hide-sm{display:none}
  table{font-size:13px} .hide-sm{display:none} }

/* App-level overrides (kit untouched). --faint darkened so 12px metadata passes AA on panel-2 and accent-weak too. */
:root{--faint:#555d69}
.side-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.side-head strong{font-size:15px}
.side .drawer-close{min-width:32px;min-height:32px;justify-content:center}
.right .drawer-close{min-width:32px;min-height:32px;justify-content:center;float:right;margin:-4px -4px 4px 8px}
.view-select,.field{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;min-height:34px}
.view-select{background:var(--panel-2);font-weight:600}
textarea.field{min-height:90px;resize:vertical}
label.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.item{min-height:44px;align-items:flex-start}
.item .dot{margin-top:2px}
.item .meta{text-align:right;line-height:1.5}
.item .line2{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag.bad{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.tag.good{background:var(--good-weak);color:var(--good);border-color:transparent}
.tag.info{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.btn{min-height:32px}
.btn.sm{padding:4px 9px;font-size:12px;min-height:28px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
button.chip{cursor:pointer;min-height:28px;font:inherit;font-size:12px;color:var(--text)}
button.chip:hover{background:var(--accent-weak)}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;min-height:24px;padding:2px 0}
.thread{display:flex;flex-direction:column;gap:10px;max-width:780px}
.msg .who{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg.sys{background:var(--warn-weak);border-color:transparent}
.msg.event{background:var(--good-weak);border-color:transparent}
.msg.note{background:var(--panel-2);border-style:dashed}
.tr{margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);color:var(--muted);font-size:13px;background:var(--panel-2);border-radius:0 6px 6px 0}
.composer{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;background:var(--panel);color:var(--text);font:inherit}
.ai-label{font-size:12px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;font-weight:600;min-height:28px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent)}
.policy{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px}
.policy.ok{border-left-color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:6px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .step:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;font-weight:700}
.check.done{background:var(--good-weak);color:var(--good)} .check.todo{background:var(--panel-2);color:var(--muted)} .check.now{background:var(--warn-weak);color:var(--warn)}
.table-wrap{overflow-x:auto}
tr.total td{font-weight:700;border-top:2px solid var(--line)}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--panel-2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mt{margin-top:12px} .mb0{margin-bottom:0}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .sub{margin:0}
.period-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.period-wrap select{width:auto}
.pop{position:fixed;left:calc(var(--rail) + 8px);top:12px;width:min(420px,calc(100vw - 90px));max-height:min(80vh,640px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:40;padding:14px}
.pop[hidden]{display:none}
.pop h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px}
.pop .res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:8px;min-height:40px}
.pop .res:hover,.pop .res:focus-visible{background:var(--panel-2)}
.right .card{margin-bottom:10px}
.right .row .btn{flex:none}
.inline-form{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--panel)}
.bottombar .role-switch{min-height:26px}
.bottombar a,.bottombar .linkish{color:var(--muted);text-decoration:underline;min-height:24px;display:inline-flex;align-items:center}
.sim-anchor{cursor:default}
.only-sm{display:none}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.tag{cursor:pointer;min-height:24px;text-align:left}
input[type=checkbox],input[type=radio]{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.spark{display:inline-block;vertical-align:middle}
.qa-row{border-bottom:1px solid var(--line);padding:10px 0}
.qa-row:last-child{border-bottom:0}
@media (max-width:760px){
  .tabs button{padding:10px 10px;font-size:13px}
  .tabbar{padding:0 6px;gap:4px}
  .tabbar .btn{padding:5px 8px;min-height:32px;font-size:13px}
  h1{font-size:17px} .sub{margin-bottom:10px}
  .content{padding:12px 14px}
  .bottombar{gap:10px;font-size:12px;padding:4px 12px}
  .panel-head{margin-bottom:8px}
  .only-sm{display:inline}
  .bottombar .hide-sm{display:none!important}
  #right-label{display:none}
  .toggle-right{min-width:36px;justify-content:center}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true">F</div>
    <button data-view="inbox" data-tab-target="conversation" aria-label="Inbox" title="Inbox"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button data-view="search" aria-label="Search" title="Search" aria-haspopup="dialog" aria-controls="pop-search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button data-view="alerts" id="rail-alerts" aria-label="Notifications" title="Notifications" aria-haspopup="dialog" aria-controls="pop-alerts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></svg><span class="badge" id="alert-badge" aria-hidden="true">0</span></button>
    <button data-view="reports" data-tab-target="reports" aria-label="Reports" title="Reports"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button data-view="admin" data-tab-target="admin" aria-label="Admin" title="Admin"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    <div class="spacer"></div>
    <div class="avatar" id="me-avatar" title="Signed in">HO</div>
  </nav>

  <aside class="side" id="side" aria-label="Section navigation">
    <button class="drawer-close btn" aria-label="Close">✕</button>
    <p id="role-note" data-testid="role-note" class="small muted" style="margin:0 4px 10px" role="status"></p>
    <div id="side-body"></div>
  </aside>

  <main class="main">
    <div class="tabbar">
      <button class="toggle-side btn" aria-label="Show conversation list"><span aria-hidden="true">☰</span><span id="side-label">Inbox</span></button>
      <div class="tabs" role="tablist" aria-label="Workspace">
        <button role="tab" id="tab-conversation" data-tab="conversation" aria-controls="panel-conversation" aria-selected="true">Conversation</button>
        <button role="tab" id="tab-ai" data-tab="ai" aria-controls="panel-ai" aria-selected="false">AI agent</button>
        <button role="tab" id="tab-migration" data-tab="migration" aria-controls="panel-migration" aria-selected="false">Migration</button>

<script>// Shared behaviour for the three mockups. No backend.
// Hooks an app can define: window.onTab(id), window.onSelect(id), window.onRail(view), window.onRole(role), window.onReady().
(function(){
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
  window.UI = { $, $$ };
  let lastFocus = null;
  function selectTab(id){
    const panel = $('#panel-' + id); if (!panel) return;
    $$('.tabs [role="tab"]').forEach(t => { const on = t.dataset.tab === id; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
    $$('.panel').forEach(p => p.hidden = p !== panel);
    // keep the rail in sync: highlight the rail button that targets this tab, if any
    const railBtn = $$('.rail button[data-tab-target]').find(b => b.dataset.tabTarget.split(' ').includes(id));
    $$('.rail button[data-view]').forEach(x => x.removeAttribute('aria-current'));
    if (railBtn) railBtn.setAttribute('aria-current', 'page');
    document.body.dataset.tab = id;
    if (window.onTab) window.onTab(id);
    try { localStorage.setItem(document.title + ':tab', id); } catch(e) {}
  }
  function openDrawer(which){
    const el = $(which === 'side' ? '.side' : '.right'); if (!el) return;
    lastFocus = document.activeElement; el.classList.add('open'); document.body.classList.add('drawer-open');
    const close = el.querySelector('.drawer-close') || el.querySelector('button,select,a,[tabindex]'); close && close.focus();
  }
  function closeDrawers(){
    $$('.side.open,.right.open').forEach(e => e.classList.remove('open')); document.body.classList.remove('drawer-open');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); lastFocus = null;
  }
  window.UI.selectTab = selectTab; window.UI.closeDrawers = closeDrawers; window.UI.openDrawer = openDrawer;
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t && t !== document.body && t !== document.documentElement) selectTab(t.dataset.tab);
    const goto = e.target.closest('[data-goto]'); if (goto) selectTab(goto.dataset.goto);
    const it = e.target.closest('.side .item[data-select]');
    if (it) { $$('.side .item[data-select]').forEach(x => x.removeAttribute('aria-current')); it.setAttribute('aria-current', 'true');
      if (window.onSelect) window.onSelect(it.dataset.select); if (window.matchMedia('(max-width:760px)').matches) closeDrawers(); }
    const r = e.target.closest('.rail button[data-view]');
    if (r) { if (r.dataset.tabTarget) selectTab(r.dataset.tabTarget.split(' ')[0]);
      $$('.rail button[data-view]').forEach(x => x.removeAttribute('aria-current')); r.setAttribute('aria-current', 'page');
      if (window.onRail) window.onRail(r.dataset.view); }
    if (e.target.closest('.toggle-side')) { $('.side').classList.contains('open') ? closeDrawers() : openDrawer('side'); }
    if (e.target.closest('.toggle-right')) { $('.right').classList.contains('open') ? closeDrawers() : openDrawer('right'); }
    if (e.target.closest('.drawer-close') || e.target.closest('.backdrop')) closeDrawers();
    const a = e.target.closest('[data-toast]'); if (a) toast(a.dataset.toast);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawers(); return; }
    const tab = e.target.closest && e.target.closest('.tabs [role="tab"]'); if (!tab) return;
    const tabs = $$('.tabs [role="tab"]').filter(t => !t.hidden), i = tabs.indexOf(tab);
    let n = null;
    if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
    if (e.key === 'ArrowLeft') n = tabs[(i + tabs.length - 1) % tabs.length];
    if (e.key === 'Home') n = tabs[0]; if (e.key === 'End') n = tabs[tabs.length - 1];
    if (n) { e.preventDefault(); n.focus(); selectTab(n.dataset.tab); }
  });
  document.addEventListener('change', e => { if (e.target.id === 'role' && window.onRole) { document.body.dataset.role = e.target.value; window.onRole(e.target.value); } });
  function toast(msg){ let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
  window.UI.toast = toast;
  window.addEventListener('DOMContentLoaded', () => {
    if (!$('.backdrop')) { const b = document.createElement('div'); b.className = 'backdrop'; b.setAttribute('aria-hidden', 'true'); document.body.appendChild(b); }
    const role = $('#role'); if (role) document.body.dataset.role = role.value;
    if (window.onReady) window.onReady();
    let start = $('.tabs [role="tab"]:not([hidden])')?.dataset.tab;
    const h = location.hash.replace('#', ''); if (h && $('#panel-' + h)) start = h;
    if (start) selectTab(start);
  });
})();
</script>

function P(key = S.period) {
  const p = D.periods[key], sl = k => D.daily[k].slice(p.from, p.to), days = p.to - p.from;
  const total = sum(sl('total')), ai = sum(sl('ai')), human = total - ai;
  const flat = key === 'mtd' ? D.plan.price : D.plan.price * days / D.daysInMonth; // MTD = the November fee (billed in advance); 7 days = prorated
  const seatCost = key === 'mtd' ? D.zendesk.seatPrice * D.zendesk.seats : D.zendesk.seatPrice * D.zendesk.seats * days / D.daysInMonth;
  const zdLow = seatCost + ai * D.zendesk.rateLow, zdHigh = seatCost + ai * D.zendesk.rateHigh;
  const frtW = sl('frtSec').map((v, i) => v * (sl('total')[i] - sl('ai')[i]));
  const firstDay = p.from + 1, lastDay = p.to;
  const inP = d => d >= firstDay && d <= lastDay;
  return { key, label: p.label, short: p.short, days, total, ai, human, aiRate: pct(ai, total),
    csatAi: [sum(sl('csatAiPos')), sum(sl('csatAiN'))], csatHum: [sum(sl('csatHumPos')), sum(sl('csatHumN'))],
    reopen: sum(sl('aiReopened')), frt: Math.round(sum(frtW) / human), cancelReq: sum(sl('cancelReq')), cancelSaved: sum(sl('cancelSaved')),
    slaRep: sum(sl('slaReplied')), slaMet: sum(sl('slaMet')), flat, seatCost, zdLow, zdHigh,
    // During November Zendesk seats are paid anyway (overlap until Nov 30), so the saving is the AI-resolution cost avoided minus the FlatDesk fee.
    saveLow: ai * D.zendesk.rateLow - flat, saveHigh: ai * D.zendesk.rateHigh - flat,
    hoursSaved: Math.round(ai * D.handleMin / 60), costPerConv: flat / total, zdPerLow: zdLow / total, zdPerHigh: zdHigh / total,
    issues: D.issues.filter(i => inP(i.day)), replacements: D.replacements.filter(r => inP(r.day)), firstDay, lastDay };
}
function billingMonth() {
  const m = P('mtd'), runRate = Math.round(m.ai / D.dayOfMonth * D.daysInMonth);
  const fromDecLow = D.zendesk.seatPrice * D.zendesk.seats + runRate * D.zendesk.rateLow - D.plan.price;
  const fromDecHigh = D.zendesk.seatPrice * D.zendesk.seats + runRate * D.zendesk.rateHigh - D.plan.price;
  return { ...m, runRate, fromDecLow, fromDecHigh, overlap: D.zendesk.seatPrice * D.zendesk.seats };
}

function spotHtml() {
  const rows = Array.from({ length: 10 }, (_, i) => { const zd = 31000 + ((i * 7919) % 17000); const msgs = 2 + (i * 3) % 7; return [zd, 'FD-' + (zd + 100000), msgs, i % 3]; });

function lineChart(vals, labels, max, color, unit) {
  const W = 360, H = 150, pad = 18, n = vals.length, x = i => pad + i * (W - 2 * pad) / (n - 1), y = v => H - 20 - (v / max) * (H - 40);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}"><line x1="${pad}" x2="${W - pad}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}"/>${vals.map((v, i) => (i % (n > 10 ? 4 : 2) === 0 || i === n - 1) ? `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"/><text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle">${v}%</text><text x="${x(i)}" y="${H - 5}" text-anchor="middle">${labels[i]}</text>` : '').join('')}</svg>`;
}
function weekly() {
  const d = D.daily.total, w1 = sum(d.slice(1, 8)), w2 = sum(d.slice(8, 15));
  const c1 = pct(sum(D.daily.csatAiPos.slice(1, 8)) + sum(D.daily.csatHumPos.slice(1, 8)), sum(D.daily.csatAiN.slice(1, 8)) + sum(D.daily.csatHumN.slice(1, 8)));
  const c2 = pct(sum(D.daily.csatAiPos.slice(8, 15)) + sum(D.daily.csatHumPos.slice(8, 15)), sum(D.daily.csatAiN.slice(8, 15)) + sum(D.daily.csatHumN.slice(8, 15)));
  return { weeks: [...D.weeklyHist.weeks, 'Nov 2', 'Nov 9'], volume: [...D.weeklyHist.volume, w1, w2], csat: [...D.weeklyHist.csat, c1, c2],
    aiRate: [w1, w2].map((w, i) => pct(sum(D.daily.ai.slice(1 + 7 * i, 8 + 7 * i)), w)) };
}
function forecast() {
  const w = weekly(), base = Math.round((w.volume[10] + w.volume[11]) / 2), rate = w.aiRate[1] / 100;
  return D.forecast.weeks.map((wk, i) => { const vol = Math.round(base * D.forecast.mult[i]), human = Math.round(vol * (1 - rate)); return { wk, vol, human, agents: Math.ceil(human * D.handleMin / 60 / D.agentHoursPerWeek), note: D.forecast.notes[i] }; });
}

function barChart(w) {
  const W = 360, H = 170, n = w.volume.length, bw = (W - 40) / n, max = Math.max(...w.volume) * 1.15;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly conversations from ${w.weeks[0]} to ${w.weeks[n - 1]}: ${w.volume.join(', ')}. CSAT ${w.csat.join(', ')} percent.">${w.volume.map((v, i) => { const bh = (v / max) * (H - 50), x = 20 + i * bw, fd = i >= n - 2; return `<rect x="${x + 4}" y="${H - 22 - bh}" width="${bw - 8}" height="${bh}" rx="3" fill="${fd ? 'var(--accent)' : 'var(--panel-2)'}" stroke="${fd ? 'none' : 'var(--muted)'}"/>${i % 2 === 1 || fd ? `<text x="${x + bw / 2}" y="${H - 26 - bh}" text-anchor="middle">${w.csat[i]}%</text>` : ''}${i % 3 === 0 || i === n - 1 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${w.weeks[i]}</text>` : ''}`; }).join('')}</svg>`;
}
function miniBars(vals, labels) {
  const W = 400, H = 110, n = vals.length, bw = (W - 20) / n, max = Math.max(...vals) * 1.2;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cancel requests per week: ${vals.join(', ')}">${vals.map((v, i) => { const bh = (v / max) * (H - 36); return `<rect x="${10 + i * bw + 3}" y="${H - 18 - bh}" width="${bw - 6}" height="${bh}" rx="2" fill="${i >= n - 2 ? 'var(--accent)' : 'var(--muted)'}"/><text x="${10 + i * bw + bw / 2}" y="${H - 22 - bh}" text-anchor="middle">${v}</text>${i % 3 === 0 || i === n - 1 ? `<text x="${10 + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${labels[i]}</text>` : ''}`; }).join('')}</svg>`;
}

    (hist.length ? `<h2>Imported Zendesk history</h2>` + hist.map(x => `<div class="small" style="padding:6px 8px">${x.date} · ${esc(x.name)} · ${esc(x.subj)} <span class="muted">${x.src}</span></div>`).join('') : '') +
    (arts.length ? `<h2>Articles</h2>` + arts.map(a => `<div class="small" style="padding:6px 8px">${esc(a)}</div>`).join('') : '') +
    (q ? '' : `<p class="note">Type to search ${num(D.imported)} imported Zendesk tickets, ${Object.keys(D.customers).length} customers in this sample, orders and articles.</p>`);
}
function openPop(which) {
  closePop(true); const p = $('#pop-' + which); p.hidden = false;
  if (which === 'search') { renderSearch(); $('#search-q').focus(); } else { renderAlerts(); S.alertsRead = true; renderRail(); p.querySelector('button').focus(); }
}
function closePop(silent) { $$('.pop').forEach(p => p.hidden = true); if (!silent) syncRail(); }
function syncRail() { const b = $$('.rail button[data-tab-target]').find(x => x.dataset.tabTarget === S.tab); $$('.rail button[data-view]').forEach(x => x.removeAttribute('aria-current')); if (b) b.setAttribute('aria-current', 'page'); }

/* ============================================================ wiring ============================================================ */
function renderPanel(t) { ({ conversation: renderConversation, ai: renderAI, migration: renderMigration, reports: renderReports, billing: renderBilling, admin: renderAdmin })[t](); }
function renderAll() { renderSide(); renderPanel(S.tab); renderRight(); renderBottom(); renderRail(); }
// The kit sets body[data-tab], so every click re-runs selectTab(current tab). Only re-render when the tab really changes (or go() forces it),
// otherwise the sidebar would be replaced before the kit looks up the clicked .side .item.
function go(t) { S.force = true; UI.selectTab(t); }
window.onTab = id => { if (id === S.tab && !S.force && S.ready) { syncRail(); return; } S.force = false; S.ready = true; S.tab = id; closePop(true); renderSide(); renderPanel(id); renderRight(); syncRail(); };
window.onSelect = id => {
  if (id.startsWith('sub:')) { const [, t, k] = id.split(':'); S.sub[t] = k; renderPanel(t); renderRight(); renderSide(); $('.content').scrollTop = 0; return; }
  openConv(id);
};
function openConv(id) {
  const c = conv(id); S.conv = id; S.form = null; S.picker = null; S.pickSel = null; S.mode = 'reply';
  if (!viewList(S.view).includes(c)) S.view = c.inbox === 'sales' && S.role === 'sales' ? 'sales' : (allowedViews().some(v => v[0] === 'all') ? 'all' : S.view);
  closePop(true);
  if (S.tab !== 'conversation') go('conversation'); else { renderSide(); renderConversation(); renderRight(); }
  $('.content').scrollTop = 0;
}
window.onRail = v => { if (v === 'search' || v === 'alerts') openPop(v); else closePop(true); };
function renderRoleNote() { const R = D.roles[S.role], hid = $$('.tabs [role="tab"]').filter(t => t.hidden).map(t => t.textContent);
  $('#role-note').innerHTML = `<span data-testid="signed-in">Signed in as <strong>${me().name}</strong> (${R.label})</span>${hid.length ? ` · Hidden for this role: ${hid.join(', ')}` : ' · Sees every tab'}`; }
window.onRole = r => {
  S.role = r; const R = D.roles[r];
  $$('.tabs [role="tab"]').forEach(t => t.hidden = !R.tabs.includes(t.dataset.tab));
  $('.tabs').dataset.visibleTabs = $$('.tabs [role="tab"]').filter(t => !t.hidden).map(t => t.dataset.tab).join(' ');
  S.view = R.view; S.picker = null; S.form = null;
  const first = viewList(S.view)[0]; if (first) S.conv = first.id;
  renderRoleNote(); renderBottom(); renderRail();
  go(R.start);
};
window.onReady = () => {
  $('.tabs').dataset.visibleTabs = D.roles.owner.tabs.join(' '); renderRoleNote();
  renderBottom(); renderRail(); renderSide(); renderRight();
  $('#search-q').addEventListener('input', renderSearch);
  setInterval(() => { renderSide(); if (S.tab === 'conversation' && !document.activeElement?.closest('.composer,.inline-form')) { /* keep composer edits */ const ta = $('#reply-box'); const v = ta?.value; renderConversation(); if (ta && $('#reply-box')) $('#reply-box').value = v; } renderRail(); }, 30000);
};
const now = () => '10:' + String(42 + elapsed()).padStart(2, '0');
function addEvent(cid, e) { (S.events[cid] = S.events[cid] || []).push({ at: now(), ...e }); }
const ACT = {
  closePop: () => closePop(),
  mode: a => { S.mode = a.dataset.v; renderConversation(); },
  tr: a => { S.tr[a.dataset.k] = !S.tr[a.dataset.k]; renderConversation(); },
  regen: () => { S.short = S.short || {}; S.short[S.conv] = !S.short[S.conv]; renderConversation(); UI.toast('Draft regenerated from the same sources'); },
  shorten: () => { S.short = S.short || {}; S.short[S.conv] = !S.short[S.conv]; renderConversation(); },
  macro: a => { const m = D.macros[+a.dataset.i]; S.inserted = S.inserted || {}; S.inserted[S.conv] = m.text; S.mode = 'reply'; renderConversation(); const ta = $('#reply-box'); ta.textContent = ta.value; ta.focus(); UI.toast(`Inserted macro “${m.name}”`); },
  send: a => {
    const c = conv(S.conv), ta = $('#reply-box'), text = ta.value.trim(), after = $('#after-status').value;
    if (!text) { UI.toast('Write something first'); return; }
    const by = me().name;
    if (S.mode === 'note') { addEvent(c.id, { cls: 'note', who: `Internal note · ${by}`, t: text }); renderConversation(); return; }
    const act = c.draft && !S.events[c.id]?.some(e => e.sent) ? c.action : null;
    if (act) {
      if (act.type === 'replacement') addEvent(c.id, { cls: 'event', who: 'Event', t: `Replacement order ${act.newId} created in Shopify (${money(act.amount)}) by ${by}`, repl: act.newId });
      if (act.type === 'claim') addEvent(c.id, { cls: 'event', who: 'Event', t: `UPS claim ${act.claimId} opened for ${c.order} by ${by}`, claim: act.claimId });
      if (act.type === 'refund') addEvent(c.id, { cls: 'event', who: 'Event', t: `Refund of ${money(act.amount, 2)} issued in Shopify on ${c.order} by ${by}`, refund: money(act.amount, 2) });
      if (act.type === 'pause') addEvent(c.id, { cls: 'event', who: 'Event', t: `Subscription SUB-221 paused until Feb 1 by ${by}` });
    }
    addEvent(c.id, { cls: 'me', who: `${by} · sent via ${c.ch}`, t: text, sent: true });
    if (act && act.type === 'sales') addEvent(c.id, { cls: 'event', who: 'CRM', t: 'Lead synced to CRM: Carter\'s Corner Café · ~15 kg/month · owner Carla M.', crm: true });
    c.status = after; if (after === 'resolved') { c.resolvedBy = 'human'; c.resolvedNote = `Resolved by ${by}`; c.resolvedToday = true; }
    c.waitMin = null; c.unread = false; if (S.inserted) delete S.inserted[c.id];
    UI.toast(`Sent to ${cust(c).name} · status ${after}`);
    if (a.dataset.next) { const nx = viewList(S.view).find(x => x.id !== c.id && isOpen(x)); if (nx) { openConv(nx.id); return; } }
    renderAll();
  },
  sendTemplate: () => { const c = conv(S.conv); addEvent(c.id, { cls: 'me', who: `${me().name} · WhatsApp template`, t: $('#tpl').value, sent: true }); renderConversation(); UI.toast('Template sent'); },
  openPicker: () => { S.picker = [S.conv]; S.pickSel = null; renderConversation(); },
  bulkReassign: () => { S.picker = viewList(S.view).map(c => c.id); S.pickSel = null; if (!S.conv || !S.picker.includes(S.conv)) S.conv = S.picker[0]; renderConversation(); if (window.matchMedia('(max-width:760px)').matches) UI.closeDrawers(); },
  pickSel: a => { S.pickSel = a.value; renderConversation(); },
  pickCancel: () => { S.picker = null; renderConversation(); },
  assignConfirm: () => { const to = user(S.pickSel); S.picker.forEach(id => { const c = conv(id); const from = c.assignee ? user(c.assignee).name : 'Unassigned'; c.assignee = to.id; addEvent(id, { cls: 'event', who: 'Event', t: `Reassigned from ${from} to ${to.name} by ${me().name}` }); }); UI.toast(`Reassigned to ${to.name}`); S.picker = null; renderAll(); },
  reassignFrom: a => { S.conv = a.dataset.id; S.picker = [a.dataset.id]; S.pickSel = null; UI.closeDrawers(); go('conversation'); },
  resolve: () => { const c = conv(S.conv); c.status = 'resolved'; c.resolvedBy = 'human'; c.resolvedToday = true; c.resolvedNote = `Resolved by ${me().name}`; c.waitMin = null; addEvent(c.id, { cls: 'event', who: 'Event', t: `Marked resolved by ${me().name}` }); renderAll(); },
  reopen: () => { const c = conv(S.conv); c.status = 'open'; c.waitMin = 0; renderAll(); },
  form: a => { S.form = a.dataset.v || null; renderRight(); },
  confirmRefund: () => { const c = conv(S.conv), amt = +$('#rf-amt').value, why = $('#rf-why').value; addEvent(c.id, { cls: 'event', who: 'Event', t: `Refund of ${money(amt, 2)} issued in Shopify on ${c.order} by ${me().name} (reason: ${why.toLowerCase()})`, refund: money(amt, 2) }); S.form = null; renderConversation(); renderRight(); UI.toast('Refund issued'); },
  confirmRepl: () => { const c = conv(S.conv), id = c.order + '-R'; addEvent(c.id, { cls: 'event', who: 'Event', t: `Replacement order ${id} created in Shopify by ${me().name} (reason: ${$('#rp-why').value.toLowerCase()})`, repl: id }); S.form = null; renderConversation(); renderRight(); },
  confirmClaim: () => { const c = conv(S.conv), o = D.orders[c.order], id = (o.carrier === 'UPS' ? 'UPS' : o.carrier) + '-CLM-' + (88000 + c.order.slice(1) % 997); addEvent(c.id, { cls: 'event', who: 'Event', t: `${o.carrier} claim ${id} opened for ${c.order} by ${me().name}`, claim: id }); S.form = null; renderConversation(); renderRight(); },
  privacy: () => { S.privacy = { cust: conv(S.conv).cust }; renderRight(); },
  privacyCancel: () => { S.privacy = null; renderRight(); },
  privacyConfirm: () => { const k = $('#privacy-kind').value, nm = cust(conv(S.conv)).name; S.privacy.kind = k; S.privacy.done = true; D.audit.unshift({ at: 'Nov 19, ' + now(), who: me().name, what: `${k === 'delete' ? 'Deletion' : 'Export'} request processed for ${nm}` }); renderRight(); },
  openConv: a => openConv(a.dataset.id),
  gotoTab: a => { closePop(true); go(a.dataset.id); },
  gap: a => { S.gap = a.dataset.id; renderAI(); renderRight(); },
  draftArticle: a => { S.editor = a.dataset.id; S.gap = a.dataset.id; renderAI(); renderRight(); },
  closeEditor: () => { S.editor = null; renderAI(); },
  publish: a => { S.gapState[a.dataset.id] = 'published'; S.editor = null; renderAI(); UI.toast('Published: the AI uses this article from now on'); },
  saveReview: a => { S.gapState[a.dataset.id] = 'review'; S.editor = null; renderAI(); },
  qa: a => { S.qa[a.dataset.id] = a.dataset.v; renderAI(); renderSide(); },
  qaSave: a => { S.qaFix[a.dataset.id] = $('#qf-' + a.dataset.id).value; renderAI(); UI.toast('Correction sent to AI knowledge'); },
  spot: () => { S.spot = true; renderMigration(); },
  goRules: () => { S.sub.admin = 'rules'; go('admin'); },
  goUsers: () => { S.sub.admin = 'users'; go('admin'); },
  agentQueue: a => { S.view = 'agent:' + a.dataset.id; const f = viewList(S.view)[0]; if (f) S.conv = f.id; go('conversation'); },
  exportBoard: () => UI.toast(`Board summary PDF generated: ${P().label}`),
  doc: a => { D.audit.unshift({ at: 'Nov 19, ' + now(), who: me().name, what: `Downloaded ${a.dataset.v}` }); renderRight(); UI.toast(`Downloading ${a.dataset.v} (mock)`); },
  guardTest: () => { const l = +$('#guard-limit').value; S.draftLimit = l; S.guardTest = 112 > l ? `Sample #4021 ($112, wrong item): hands off to a human, because $112 is over the $${l} limit.` : `Sample #4021 ($112, wrong item): AI can handle it and creates the replacement itself, because $112 is within the $${l} limit.`; renderAdmin(); },
  guardSave: () => { const l = S.draftLimit, old = D.policy.limit; D.policy.limit = l; D.audit.unshift({ at: 'Nov 19, ' + now(), who: me().name, what: `Changed AI guardrail “refunds or replacements” limit $${old} → $${l}` }); S.draftLimit = null; renderAdmin(); renderRight(); renderSide(); UI.toast('Rule saved; applies to new conversations'); },
  bpoOpen: () => { S.bpoOpen = true; renderAdmin(); },
  bpoCancel: () => { S.bpoOpen = false; renderAdmin(); },
  bpoCreate: () => { const b = D.bpoDraft; b.people.forEach((p, i) => D.users.push({ id: 'bpo' + i, name: p, role: 'Agent (Overflow group)', seat: true, status: 'invited', idp: 'Invited · SSO guest' })); D.groups.push({ name: b.group, members: b.people.map(p => p.split(' (')[0]).join(', '), access: b.access, hours: b.hours });
    D.audit.unshift({ at: 'Nov 19, ' + now(), who: me().name, what: `Created group Overflow (${b.people.length} outsourced agents, ${b.access.toLowerCase()}, ${b.hours})` }); S.bpoOpen = false; renderAll(); UI.toast('Invites sent'); }
};
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && !a.disabled) ACT[a.dataset.act]?.(a);
  if (!e.target.closest('.pop') && !e.target.closest('.rail') && $$('.pop').some(p => !p.hidden)) closePop(); });
document.addEventListener('change', e => {
  if (e.target.matches('[data-period]')) { S.period = e.target.value; renderPanel(S.tab); renderRight(); renderSide(); }
  if (e.target.matches('[data-filter]')) { S.filters[e.target.dataset.filter] = e.target.value; renderRight(); }
  if (e.target.id === 'guard-limit') { S.draftLimit = +e.target.value; S.guardTest = null; renderAdmin(); }
  if (e.target.id === 'zd-upload' && e.target.files.length) UI.toast('Invoice received (mock): we\'ll replace the estimate with your contract numbers');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $$('.pop').some(p => !p.hidden)) { closePop(); } });
</script>
