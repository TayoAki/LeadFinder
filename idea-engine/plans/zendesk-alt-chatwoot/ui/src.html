<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlatDesk mockup</title>
<style>/*SHELL_CSS*/
/* App-level overrides (kit untouched). --faint darkened so 12px metadata passes AA on panel-2 and accent-weak too. */
:root{--faint:#555d69}
.side-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.side-head strong{font-size:15px}
.side .drawer-close{min-width:32px;min-height:32px;justify-content:center}
.right .drawer-close{min-width:32px;min-height:32px;justify-content:center;float:right;margin:-4px -4px 4px 8px}
.view-select,.field{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;min-height:34px}
.view-select{background:var(--panel-2);font-weight:600}
textarea.field{min-height:90px;resize:vertical}
label.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.item{min-height:44px;align-items:flex-start}
.item .dot{margin-top:2px}
.item .meta{text-align:right;line-height:1.5}
.item .line2{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag.bad{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.tag.good{background:var(--good-weak);color:var(--good);border-color:transparent}
.tag.info{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.btn{min-height:32px}
.btn.sm{padding:4px 9px;font-size:12px;min-height:28px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
button.chip{cursor:pointer;min-height:28px;font:inherit;font-size:12px;color:var(--text)}
button.chip:hover{background:var(--accent-weak)}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;min-height:24px;padding:2px 0}
.thread{display:flex;flex-direction:column;gap:10px;max-width:780px}
.msg .who{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg.sys{background:var(--warn-weak);border-color:transparent}
.msg.event{background:var(--good-weak);border-color:transparent}
.msg.note{background:var(--panel-2);border-style:dashed}
.tr{margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);color:var(--muted);font-size:13px;background:var(--panel-2);border-radius:0 6px 6px 0}
.composer{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;background:var(--panel);color:var(--text);font:inherit}
.ai-label{font-size:12px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;font-weight:600;min-height:28px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent)}
.policy{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px}
.policy.ok{border-left-color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:6px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .step:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;font-weight:700}
.check.done{background:var(--good-weak);color:var(--good)} .check.todo{background:var(--panel-2);color:var(--muted)} .check.now{background:var(--warn-weak);color:var(--warn)}
.table-wrap{overflow-x:auto}
tr.total td{font-weight:700;border-top:2px solid var(--line)}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--panel-2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mt{margin-top:12px} .mb0{margin-bottom:0}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .sub{margin:0}
.period-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.period-wrap select{width:auto}
.pop{position:fixed;left:calc(var(--rail) + 8px);top:12px;width:min(420px,calc(100vw - 90px));max-height:min(80vh,640px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:40;padding:14px}
.pop[hidden]{display:none}
.pop h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px}
.pop .res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:8px;min-height:40px}
.pop .res:hover,.pop .res:focus-visible{background:var(--panel-2)}
.right .card{margin-bottom:10px}
.right .row .btn{flex:none}
.inline-form{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--panel)}
.bottombar .role-switch{min-height:26px}
.bottombar a,.bottombar .linkish{color:var(--muted);text-decoration:underline;min-height:24px;display:inline-flex;align-items:center}
.sim-anchor{cursor:default}
.bottombar{gap:14px}
td .tag,td .pill{white-space:nowrap} [data-testid=dsr-log] td:first-child{white-space:nowrap}
.only-sm{display:none}
.bottombar [hidden],.rail [hidden]{display:none!important}
/* round 3: disabled states, criteria, selected rows, tab strip fades on both edges, toasts above the phone chrome */
.btn[disabled],.btn[disabled]:hover{opacity:.5;cursor:not-allowed;background:transparent;border-style:dashed;filter:none}
select[disabled],input[disabled]{opacity:.6;cursor:not-allowed}
fieldset.crit{border:0;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
fieldset.crit label{min-height:26px}
tr.sel td{background:var(--accent-weak)}
tr.clickable:focus-visible{outline:2px solid var(--focus)}
.tabs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);padding:0 10px}
@media (min-width:1181px){.tabs{-webkit-mask-image:none;mask-image:none;padding:0}}
.bottombar .role-switch{max-width:none;width:auto}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.tag{cursor:pointer;min-height:24px;text-align:left}
input[type=checkbox],input[type=radio]{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.spark{display:inline-block;vertical-align:middle}
.qa-row{border-bottom:1px solid var(--line);padding:10px 0}
.qa-row:last-child{border-bottom:0}
@media (max-width:760px){
  .tabs button{padding:10px 10px;font-size:13px}
  .tabbar{padding:0 6px;gap:4px}
  .tabbar .btn{padding:5px 8px;min-height:32px;font-size:13px}
  h1{font-size:17px} .sub{margin-bottom:10px}
  .content{padding:12px 14px}
  .bottombar{gap:10px;font-size:12px;padding:4px 12px}
  .panel-head{margin-bottom:8px}
  .only-sm{display:inline}
  .bottombar .hide-sm{display:none!important}
  #right-label{display:none}
  .toggle-right{min-width:36px;justify-content:center}
  .toast{bottom:112px;max-width:calc(100vw - 32px)}
  fieldset.crit{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true">F</div>
    <button data-view="inbox" data-tab-target="conversation" aria-label="Inbox" title="Inbox"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button data-view="search" aria-label="Search" title="Search" aria-haspopup="dialog" aria-controls="pop-search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button data-view="alerts" id="rail-alerts" aria-label="Notifications" title="Notifications" aria-haspopup="dialog" aria-controls="pop-alerts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></svg><span class="badge" id="alert-badge" aria-hidden="true">0</span></button>
    <button data-view="reports" data-tab-target="reports" aria-label="Reports" title="Reports"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button data-view="admin" data-tab-target="admin" aria-label="Admin" title="Admin"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    <div class="spacer"></div>
    <div class="avatar" id="me-avatar" title="Signed in">HO</div>
  </nav>

  <aside class="side" id="side" aria-label="Section navigation">
    <button class="drawer-close btn" aria-label="Close">✕</button>
    <p id="role-note" data-testid="role-note" class="small muted" style="margin:0 4px 10px" role="status"></p>
    <div id="side-body"></div>
  </aside>

  <main class="main">
    <div class="tabbar">
      <button class="toggle-side btn" aria-label="Show conversation list"><span aria-hidden="true">☰</span><span id="side-label">Inbox</span></button>
      <div class="tabs" role="tablist" aria-label="Workspace">
        <button role="tab" id="tab-conversation" data-tab="conversation" aria-controls="panel-conversation" aria-selected="true">Conversation</button>
        <button role="tab" id="tab-ai" data-tab="ai" aria-controls="panel-ai" aria-selected="false">AI agent</button>
        <button role="tab" id="tab-migration" data-tab="migration" aria-controls="panel-migration" aria-selected="false">Migration</button>
        <button role="tab" id="tab-reports" data-tab="reports" aria-controls="panel-reports" aria-selected="false">Reports</button>
        <button role="tab" id="tab-billing" data-tab="billing" aria-controls="panel-billing" aria-selected="false">Billing</button>
        <button role="tab" id="tab-admin" data-tab="admin" aria-controls="panel-admin" aria-selected="false">Admin</button>
      </div>
      <button class="toggle-right btn" aria-label="Show customer details"><span aria-hidden="true">ⓘ</span><span id="right-label">Customer</span></button>
    </div>
    <div class="content">
      <section class="panel" id="panel-conversation" role="tabpanel" aria-labelledby="tab-conversation"></section>
      <section class="panel" id="panel-ai" role="tabpanel" aria-labelledby="tab-ai" hidden></section>
      <section class="panel" id="panel-migration" role="tabpanel" aria-labelledby="tab-migration" hidden></section>
      <section class="panel" id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" hidden></section>
      <section class="panel" id="panel-billing" role="tabpanel" aria-labelledby="tab-billing" hidden></section>
      <section class="panel" id="panel-admin" role="tabpanel" aria-labelledby="tab-admin" hidden></section>
    </div>
  </main>

  <aside class="right" id="right" aria-label="Context for this tab">
    <button class="drawer-close btn" aria-label="Close">✕</button>
    <div id="right-body"></div>
  </aside>

  <footer class="bottombar" aria-label="Status">
    <span data-testid="live-status"><span class="status-dot" aria-hidden="true"></span><span class="hide-sm">Live since Nov 1 · 4 channels</span><span class="only-sm">Live</span></span>
    <span class="hide-sm" data-testid="seats"></span>
    <span class="hide-sm" id="bb-ai"></span>
    <span class="sep"></span>
    <button class="linkish hide-sm" id="bb-savings" data-goto="billing"></button>
    <span class="hide-sm sim-anchor" data-testid="clock">Thu Nov 19 · 10:42 ET</span>
    <label class="row" style="gap:6px;flex-wrap:nowrap;white-space:nowrap"><span>View as</span>
      <select id="role" class="role-switch"><option value="owner">Owner · Hana</option></select></label>
  </footer>
</div>

<div class="pop" id="pop-search" role="dialog" aria-modal="false" aria-labelledby="pop-search-title" hidden>
  <div class="row between"><strong id="pop-search-title">Search</strong><button class="btn sm" data-act="closePop" aria-label="Close search">✕</button></div>
  <label class="lbl" for="search-q">Conversations, customers, orders, articles (incl. 48,210 imported Zendesk tickets)</label>
  <input id="search-q" class="field" type="search" placeholder="Try “4021”, “Lucía” or “refund”" autocomplete="off">
  <div id="search-results"></div>
</div>
<div class="pop" id="pop-alerts" role="dialog" aria-modal="false" aria-labelledby="pop-alerts-title" hidden>
  <div class="row between"><strong id="pop-alerts-title">Notifications</strong><button class="btn sm" data-act="closePop" aria-label="Close notifications">✕</button></div>
  <div id="alerts-body"></div>
</div>

function staffingCalc() {
  const fc = forecast(), wk = fc[1], rate = 1 - wk.human / wk.vol, day = D.staffing.days.find(d => d.id === S.staffDay), dayVol = wk.vol * day.share;
  const chShare = S.staffCh === 'all' ? 1 : D.staffing.channels[S.staffCh], ovf = D.users.filter(u => u.vendor && u.seat).length;
  return D.staffing.hourly.map((s, hr) => {
    const arrivals = dayVol * s, human = arrivals * (1 - rate), need = Math.ceil(human * D.handleMin / 60 / D.occupancy - 0.05);
    const inhouse = S.staffDay === 'thu' ? 0 : D.staffing.shifts.filter(x => hr >= x.from && hr < x.to).length, over = (hr >= 18 || hr < 8) ? ovf : 0;
    return { hr, ch: Math.round(arrivals * chShare), chHuman: Math.round(human * chShare), need, sched: inhouse + over, inhouse, over };
  });
}

  reassignFrom: a => { S.conv = a.dataset.id; S.picker = [a.dataset.id]; S.pickSel = null; S.back = { tab: 'reports', sub: 'sla', label: 'SLA report' }; UI.closeDrawers(); go('conversation'); },
  resolve: () => { const c = conv(S.conv); c.status = 'resolved'; c.resolvedBy = 'human'; c.resolvedToday = true; c.resolvedNote = `Resolved by ${me().name}`; c.waitMin = null; addEvent(c.id, { cls: 'event', who: 'Event', t: `Marked resolved by ${me().name}` }); renderAll(); },
  reopen: () => { const c = conv(S.conv); c.status = 'open'; c.waitMin = 0; renderAll(); },
  form: a => { S.form = a.dataset.v || null; renderRight(); },
  confirmRefund: () => { const c = conv(S.conv), amt = +$('#rf-amt').value, why = $('#rf-why').value; S.form = null; if (amt > D.policy.limit && !perm('approve')) { requestApproval(c, 'refund', amt); return; }
    addEvent(c.id, { cls: 'event', who: 'Event', t: `Refund of ${money(amt, 2)} issued in Shopify on ${c.order} by ${me().name} (reason: ${why.toLowerCase()})`, refund: money(amt, 2) }); renderConversation(); renderRight(); UI.toast('Refund issued'); },
  confirmRepl: () => { const c = conv(S.conv), id = c.order + '-R', amt = orderTotal(D.orders[c.order]); S.form = null; if (amt > D.policy.limit && !perm('approve')) { requestApproval(c, 'replacement', amt); return; }
    addEvent(c.id, { cls: 'event', who: 'Event', t: `Replacement order ${id} created in Shopify by ${me().name} (reason: ${$('#rp-why').value.toLowerCase()})`, repl: id }); renderConversation(); renderRight(); },
  confirmClaim: () => { const c = conv(S.conv), o = D.orders[c.order], id = o.carrier + '-CLM-' + (88000 + c.order.slice(1) % 997); addEvent(c.id, { cls: 'event', who: 'Event', t: `${o.carrier} claim ${id} opened for ${c.order} by ${me().name}`, claim: id }); S.form = null; renderConversation(); renderRight(); },
  privacy: () => { S.privacy = { cust: conv(S.conv).cust }; renderRight(); },
  privacyCancel: () => { S.privacy = null; renderRight(); },
  privacyRequest: () => { const c = conv(S.conv), cu = cust(c), eu = /EU/.test(cu.region || ''), id = 'DSR-' + String(12 + D.dsr.filter(d => +d.id.slice(4) >= 12).length).padStart(3, '0');
    D.dsr.unshift({ id, cust: c.cust, type: 'Deletion', who: cu.name + (cu.region ? ` (${cu.region})` : ''), law: eu ? 'GDPR' : 'CCPA', source: `Agent request (${me().name}) from conversation`, received: D.todayShort, due: eu ? 'Dec 19 (30 days)' : 'Jan 3 (45 days)', verify: 'Not verified yet', status: 'Awaiting identity check', owner: 'Pat D.' });
    audit('Privacy', `Deletion request ${id} raised for ${cu.name} (sent to Pat D.)`); renderRight(); UI.toast(`Request ${id} sent to Pat D.`); },
  privacyConfirm: a => { if (a.disabled) return; const c = conv(S.conv), cu = cust(c), k = $('#privacy-kind').value, v = $('#privacy-verify').selectedOptions[0].text, eu = /EU/.test(cu.region || '');
    const existing = D.dsr.find(d => d.cust === c.cust && !d.status.startsWith('Completed')), id = existing?.id || 'DSR-' + String(12 + D.dsr.filter(d => +d.id.slice(4) >= 12).length).padStart(3, '0');
    const rec = { id, cust: c.cust, type: k === 'delete' ? 'Deletion' : 'Access (export)', who: cu.name + (cu.region ? ` (${cu.region})` : ''), law: eu ? 'GDPR' : 'CCPA', source: $('#privacy-source').value, received: existing?.received || D.todayShort, due: eu ? 'Dec 19 (30 days)' : 'Jan 3 (45 days)', verify: v, status: k === 'delete' ? `Completed ${D.todayShort} · purged from backups by Dec 24` : `Completed ${D.todayShort}`, by: me().name };
    if (existing) Object.assign(existing, rec); else D.dsr.unshift(rec);
    S.privacy = { cust: c.cust, done: true, id, name: cu.name };
    if (k === 'delete') { cu.deleted = id; cu.deletedOn = D.todayShort; cu.purgeBy = 'Dec 24'; D.conversations.filter(x => x.cust === c.cust).forEach(x => { if (isOpen(x)) { x.status = 'resolved'; x.resolvedBy = 'human'; x.resolvedNote = `Closed: customer data deleted (${id})`; x.waitMin = null; } x.unread = false; });
      D.approvals.filter(ap => conv(ap.conv).cust === c.cust && ap.status === 'pending').forEach(ap => ap.status = 'cancelled (customer deleted)'); }
    audit('Privacy', `${rec.type} request ${id} completed for ${cu.name}${k === 'delete' ? ' · deleted from FlatDesk ' + D.todayShort : ''}`);
    renderAll(); UI.toast(k === 'delete' ? `Deleted from FlatDesk · ${id}` : `Export ready · ${id}`); },
  openConv: a => { if (a.dataset.back) S.back = { tab: 'reports', sub: a.dataset.back, label: SUBS.reports.find(x => x[0] === a.dataset.back)[1] }; openConv(a.dataset.id); },
  gap: a => { S.gap = a.dataset.id; renderAI(); renderRight(); },
  goGap: a => { S.gap = a.dataset.id; gotoSub('ai', 'gaps'); },
  draftArticle: a => { S.editor = a.dataset.id; S.gap = a.dataset.id; renderAI(); renderRight(); },
  closeEditor: () => { S.editor = null; renderAI(); },
  publish: a => { S.gapState[a.dataset.id] = 'published'; S.editor = null; renderAI(); renderSide(); renderRight(); UI.toast('Published: the AI uses this article from now on'); },
  saveReview: a => { S.gapState[a.dataset.id] = 'review'; S.editor = null; renderAI(); },
  replyArticle: a => { const g = D.gaps.find(x => x.id === a.dataset.id); g.samples.filter(s => s.conv && isOpen(conv(s.conv))).forEach(s => { const c = conv(s.conv); addEvent(c.id, { cls: 'me', who: `${user(c.assignee).name} · sent via ${c.ch} (article sent by ${me().name})`, t: `Hi ${cust(c).name.split(' ')[0]}, yes! ${g.article.split('\n\n')[1]} Full details: help.northbrew.example/shipping-puerto-rico`, sent: true, article: true }); c.status = 'pending'; c.waitMin = null; });
    renderAll(); UI.toast('Article sent'); },
  qaMode: a => { S.qaMode = a.dataset.v; renderAI(); renderSide(); },
  qaScore: a => { const id = a.dataset.id, crit = {}; QA_CRIT.forEach(([k]) => crit[k] = $(`[data-crit="${id}:${k}"]`).checked); const score = Object.values(crit).filter(Boolean).length; S.qa[id] = { crit, score, pass: score === 4 }; renderAI(); renderSide(); renderRight(); },
  qaSave: a => { S.qaFix[a.dataset.id] = $('#qf-' + a.dataset.id).value; renderAI(); UI.toast('Correction sent to AI knowledge'); },
  qaReopen: a => { const c = conv(a.dataset.id); c.reopenedByQa = true; addEvent(c.id, { cls: 'me', who: `✦ AI agent · corrected reply approved by ${me().name}`, t: S.qaFix[c.id], sent: true, qaReopen: true }); c.status = 'pending'; renderAI(); UI.toast(`Corrected reply sent to ${cust(c).name}`); },
  spot: () => { S.spot = true; renderMigration(); },
  goRules: () => gotoSub('admin', 'rules'),
  goUsers: () => gotoSub('admin', 'users'),
  agentQueue: a => { S.view = 'agent:' + a.dataset.id; S.back = { tab: 'reports', sub: 'sla', label: 'SLA report' }; const f = viewList(S.view)[0]; if (f) S.conv = f.id; go('conversation'); },
  coach: a => { S.coach = a.dataset.id || null; renderRight(); if (S.coach && window.matchMedia('(max-width:1180px)').matches) UI.openDrawer('right'); },
  reason: a => { S.reason = a.dataset.id; renderReports(); renderRight(); },
  product: a => { S.product = a.dataset.id; renderRight(); },
  flagProduct: a => { S.flags[a.dataset.id] = true; audit('Product', `Flagged product page conflict on ${a.dataset.id} to the page owner`); renderReports(); renderRight(); UI.toast('Flagged to the product page owner'); },
  exportBoard: () => UI.toast(`Board summary PDF generated: ${P().label}`),
  exportReason: () => UI.toast('CSV ready: customers with this contact reason'),
  exportIssues: () => UI.toast('Issues CSV downloaded'),
  exportAudit: () => UI.toast(`Audit log CSV downloaded (${D.audit.length} entries)`),
  shareVendor: () => UI.toast('Vendor SLA report link copied (read-only, expires in 30 days)'),
  send3pl: () => { S.sent3pl = true; renderReports(); },
  fileClaims: () => { S.claimsFiled = true; renderReports(); },
  setReminder: () => { S.reminder = true; renderBilling(); renderRail(); },
  doc: a => { audit('Documents', `Downloaded ${a.dataset.v}`); renderRight(); UI.toast(`Downloading ${a.dataset.v}`); },
  siem: () => { S.siem = true; audit('Security', 'Connected audit-log stream to Splunk HEC'); renderAdmin(); renderRight(); },
  signout: a => { S.signedOut[a.dataset.id] = true; audit('Security', `Signed ${user(a.dataset.id).name} out of all sessions`); renderAdmin(); renderRight(); },
  trigTest: a => { const t = D.rules.triggers.find(x => x.id === a.dataset.id); S.triggerTests[t.id] = { t1: 'Sample: new email from Ana Lopez → auto-acknowledgement sent ✓', t2: 'Sample: Lucía Fernández (Spanish) → Spanish group ✓', t3: 'Sample: tag vip → urgent, SLA 1h ✓', t4: 'Sample: Alex Morgan pending 4 days → resolved ✓ (would not have closed under Zendesk: it was never Solved)', t5: 'Sample: refund $38 → confirm step shown ✓', t6: 'Sample: resolve → CSAT survey sent ✓', t7: 'Sample: reopened twice → assigned to Jordan P. ✓', t8: t.status === 'Needs review' ? 'Sample: angry message → nothing happens ✗ (no FlatDesk equivalent yet)' : 'Sample: angry message → Slack #support-alerts ✓ (webhook)' }[t.id]; renderAdmin(); },
  hookTest: () => { S.hook = { tested: true }; D.deliveries.unshift({ at: nowStr(), hook: 'slack-angry-customer (test)', event: 'message.created · tone negative', code: 200, ms: 142 }); renderAdmin(); },
  hookSave: () => { S.hook.saved = true; const t = D.rules.triggers.find(x => x.id === 't8'); t.status = 'Mapped with changes'; t.fd = 'Webhook: negative tone → Slack #support-alerts'; t.note = 'Replaced the Zendesk Slack app with a FlatDesk webhook'; D.integrations.find(i => i.name === 'Slack').status = 'Healthy'; D.integrations.find(i => i.name === 'Slack').last = 'Test delivered ' + nowStr();
    audit('Integrations', 'Replaced Zendesk trigger “Slack alert on angry customer” with a webhook'); renderAll(); },
  guardTest: () => { const l = +$('#guard-limit').value; S.draftLimit = l; S.guardTest = 112 > l ? `Sample #4021 ($112, wrong item): needs a lead's approval, because $112 is over the $${l} limit.` : `Sample #4021 ($112, wrong item): AI and agents can handle it without approval, because $112 is within the $${l} limit.`; renderAdmin(); },
  guardSave: () => { const l = S.draftLimit, old = D.policy.limit; D.policy.limit = l; D.policy.changedBy = me().name; D.policy.changedAt = nowStr(); audit('Rules', `Changed AI guardrail “refunds or replacements” limit $${old} → $${l}`); S.draftLimit = null; S.guardTest = null; renderAll(); UI.toast('Rule saved; open tickets re-checked'); },
  bpoOpen: () => { S.bpoOpen = true; renderAdmin(); },
  bpoCancel: () => { S.bpoOpen = false; renderAdmin(); },
  bpoCreate: () => { const b = D.bpoDraft, tz = $('#bpo-tz').value, from = $('#bpo-from').value, to = $('#bpo-to').value, thx = $('#bpo-thx').checked, bf = $('#bpo-bf').checked;
    D.users.push({ id: 'ravi', name: b.person, role: 'Agent (Overflow group)', seat: true, status: 'invited', statusText: 'Invited', vendor: true });
    const g = D.groups.find(x => x.key === 'overflow'); g.members += ', ' + b.person; g.hours = `${from}–${to} ${tz}, every day${thx ? ' · Thanksgiving: all day' : ''}${bf ? ' · Nov 27 and Nov 30: from 14:00' : ''}`;
    audit('Users', `Added ${b.person} to Overflow (${g.hours}); seats ${seatsUsed()}/${D.plan.seats}`); S.bpoOpen = false; renderAll(); UI.toast('Invite sent'); }
};
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && !a.disabled) ACT[a.dataset.act]?.(a);
  if (!e.target.closest('.pop') && !e.target.closest('.rail') && $$('.pop').some(p => !p.hidden)) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $$('.pop').some(p => !p.hidden)) closePop();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-period]')) { S.period = t.value; renderPanel(S.tab); renderRight(); renderSide(); }
  else if (t.matches('[data-filter]')) { S.filters[t.dataset.filter] = t.value; if (t.id === 'group-filter') renderReports(); renderRight(); }
  else if (t.id === 'guard-limit') { S.draftLimit = +t.value; S.guardTest = null; renderAdmin(); }
  else if (t.id === 'privacy-verify') { S.privacy.verify = t.value; const kind = $('#privacy-kind').value, src = $('#privacy-source').value; renderRight(); $('#privacy-kind').value = kind; $('#privacy-source').value = src; }
  else if (t.id === 'tpl') { S.tpl = t.value; renderConversation(); }
  else if (t.id === 'staff-day') { S.staffDay = t.value; renderReports(); }
  else if (t.id === 'staff-ch') { S.staffCh = t.value; renderReports(); }
  else if (t.id === 'retention') { const old = D.retention; D.retention = +t.value; audit('Privacy', `Retention changed: ${old || 'never'} → ${D.retention ? D.retention + ' months' : 'never'}`); renderAdmin(); renderRight(); }
  else if (t.id === 'ip-allow') { S.ipAllow = t.checked; audit('Security', `IP allowlist ${S.ipAllow ? 'turned on' : 'turned off'}`); renderAdmin(); renderRight(); }
  else if (t.id === 'audit-type') { S.auditType = t.value; renderAdmin(); }
  else if (t.id === 'audit-actor') { S.auditActor = t.value; renderAdmin(); }
  else if (t.id === 'zd-upload' && t.files.length) UI.toast('Invoice received: we\'ll use your contract numbers in the comparison');
});
</script>
